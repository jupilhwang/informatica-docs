/OnPrem__ultra-messaging__edge-data-streaming__2-4-0/h2l/0735-configuring-vibe-data-stream-for-machine-data-on-a-multihom.pdf", "t": "Configuring vibe data stream for machine data on a multihom", "f": "0735-configuring-vibe-data-stream-for-machine-data-on-a-multihom", "h": 1, "l": 0, "i": 88}, {"p": "docs/4_Others/OnPrem__ultra-messaging__ultra-messaging-dynamic-routing-option__6-13-1/guides/UMQ_6131_DocumentationIntroduction_en.pdf", "t": "Documentation Introduction", "f": "UMQ_6131_DocumentationIntroduction_en", "h": 0, "l": 0, "i": 89}, {"p": "docs/4_Others/OnPrem__ultra-messaging__ultra-messaging-persistence-edition__6-13-1/guides/UMQ_6131_DocumentationIntroduction_en.pdf", "t": "Documentation Introduction", "f": "UMQ_6131_DocumentationIntroduction_en", "h": 0, "l": 0, "i": 90}, {"p": "docs/4_Others/OnPrem__ultra-messaging__ultra-messaging-queuing-edition__6-13-1/guides/UMQ_6131_DocumentationIntroduction_en.pdf", "t": "Documentation Introduction", "f": "UMQ_6131_DocumentationIntroduction_en", "h": 0, "l": 0, "i": 91}, {"p": "docs/4_Others/OnPrem__ultra-messaging__ultra-messaging-streaming-edition__6-13-1/guides/UMQ_6131_DocumentationIntroduction_en.pdf", "t": "Documentation Introduction", "f": "UMQ_6131_DocumentationIntroduction_en", "h": 0, "l": 0, "i": 92}], "phases": [{"id": "P0", "title": "오리엔테이션 & IDMC 플랫폼 기초", "level": "입문", "track": "Cloud", "goal": "IDMC 구조(조직·사용자·런타임·Secure Agent)를 이해하고 실습 환경을 준비한다.", "steps": [{"d": "data-governance-and-quality-cloud__data-quality", "f": "IICS_.*_GettingStarted$", "why": "IDMC 공통 UI·서비스 전체 둘러보기", "doc": 1396}, {"d": "cloud-common-services__administrator", "f": "1414-getting-started", "why": "IDMC 첫 로그인부터 기본 흐름", "doc": 15}, {"d": "idmc-glossary", "f": "Glossary", "why": "용어 정리", "doc": 39}, {"d": "cloud-common-services__administrator", "f": "OrganizationAdministration", "why": "조직·서브조직·라이선스", "doc": 7}, {"d": "cloud-common-services__administrator", "f": "UserAdministration", "why": "사용자·그룹·역할", "doc": 11}, {"d": "cloud-common-services__administrator", "f": "RuntimeEnvironments", "why": "Secure Agent·Serverless 런타임", "doc": 9}, {"d": "cloud-common-services__administrator", "f": "1449-secure-agent-quick-start-for-linux", "why": "실습: Linux Secure Agent 설치", "doc": 17}, {"d": "cloud-common-services__administrator", "f": "1297-secure-agent-quick-start-for-windows", "why": "실습: Windows Secure Agent 설치", "doc": 12}, {"d": "cloud-common-services__administrator", "f": "SecureAgentServices", "why": "Agent 서비스 구성", "doc": 10}, {"d": "cloud-common-services__administrator", "f": "_Connections$", "why": "연결(Connection) 관리", "doc": 1}], "summary": "<h1 id=\"p0-오리엔테이션--idmc-플랫폼-기초\">P0. 오리엔테이션 &amp; IDMC\n플랫폼 기초</h1>\n<blockquote>\n<p>IDMC의 조직·사용자·런타임 구조를 이해하고, Secure Agent와\nConnection을 갖춘 실습 환경을 직접 만든다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>Organization, Sub-organization, License, Metering(IPU)으로 이루어진\nIDMC 조직 구조</li>\n<li>User, User group, Role, Permission으로 접근 권한을 나누는 방법</li>\n<li>Runtime Environment의 종류(Hosted Agent, Secure Agent group,\nElastic, Serverless)와 선택 기준</li>\n<li>Windows/Linux에 Secure Agent를 설치·등록하고 서비스 구성을 확인하는\n절차</li>\n<li>Administrator의 Connections 페이지에서 Connection을 만들고\n테스트하는 방법</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Organization</td>\n<td>라이선스, 사용자 계정, Mapping·Task 같은 자산, 작업·보안 정보를 담는\nIDMC 저장소 안의 보안 영역. 무료 체험으로 만든 조직은 기본적으로\nproduction organization이다.</td>\n</tr>\n<tr>\n<td>Sub-organization</td>\n<td>production organization의 하위 조직. 자산·Connection·Runtime\nEnvironment·사용자를 따로 가지며, 상위 조직이 Runtime Environment와\nadd-on connector를 공유할 수 있다.</td>\n</tr>\n<tr>\n<td>IPU (Informatica processing unit)</td>\n<td>usage-based 라이선스의 사용량 단위. 작업을 실행하면 소비되고,\nMetering 페이지에서 구매·소비·잔여량을 본다.</td>\n</tr>\n<tr>\n<td>Runtime Environment</td>\n<td>Task와 Taskflow를 실행하는 플랫폼. 조직마다 최소 하나가 있어야\n사용자가 Task를 실행할 수 있다.</td>\n</tr>\n<tr>\n<td>Secure Agent</td>\n<td>Task를 실행하고 방화벽 너머 IDMC와 사내 시스템 간 보안 통신을 맡는\n경량 프로그램. 연결이 끊기면 재연결을 시도하고, 실패하면 Task가\n실패한다.</td>\n</tr>\n<tr>\n<td>Hosted Agent</td>\n<td>Informatica 클라우드 시설에서 돌아가는 런타임. 설치할 것이 없지만\n지원 Connector가 정해져 있고 추가·설정이 불가능하다.</td>\n</tr>\n<tr>\n<td>Serverless runtime environment</td>\n<td>Secure Agent 설치·유지 없이 쓰는 단일 테넌트 런타임. 워크로드에 맞춰\n자동 확장되고 데이터는 고객 클라우드에 남는다.</td>\n</tr>\n<tr>\n<td>Secure Agent services</td>\n<td>Agent가 쓰는 플러그형 마이크로서비스. Data Integration Server는\nMapping·Task·Taskflow를, Process Server는 Application Integration\n프로세스를 실행한다.</td>\n</tr>\n<tr>\n<td>Role / Permission</td>\n<td>Role은 자산·기능별 privilege 묶음이다. Permission은 Secure Agent,\nConnection, Schedule, 자산 단위로 read/update/delete/execute 권한을\n추가로 건다.</td>\n</tr>\n<tr>\n<td>Connection</td>\n<td>소스·룩업·타겟 위치를 지정하는 접속 정보. Connector로 만들며, 실행\n중인 Agent가 있는 Runtime Environment를 지정해야 한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>호환 브라우저와 Product Availability Matrix를 확인하고 Runtime\nEnvironment가 있는지 점검한다. [Getting Started (Data Quality)]</li>\n<li>Agent 설치 전제조건을 확인한다. 지원 OS, 여유 디스크 5 GB 이상, 플랫\n파일 디렉터리 접근 권한, 방화벽에서 IDMC 도메인과 443(HTTPS) 허용.\n[Secure Agent Quick Start for Linux/Windows]</li>\n<li>Administrator &gt; Runtime Environments에서 Download Secure Agent를\n누르고 OS 플랫폼을 고른 뒤 install token을 복사한다. [Secure Agent Quick\nStart for Linux/Windows]</li>\n<li>Linux는 <code>./agent64_install_ng_ext.bin -i console</code>로\n설치하고 <code>apps/agentcore</code>에서\n<code>./infaagent.sh startup</code>으로 시작한다. 이어서\n<code>./consoleAgentManager.sh configureToken &lt;user name&gt; &lt;install token&gt;</code>으로\n등록하고 <code>isConfigured</code>로 확인한다. [Secure Agent Quick Start\nfor Linux]</li>\n<li>Windows는 <code>agent64_install_ng_ext.exe</code>를 실행하고 Secure\nAgent Manager에서 User Name과 Install Token으로 Register한다. 이후\nServices에서 Log On 계정을 지정하고 서비스를 재시작한다. [Secure Agent\nQuick Start for Windows]</li>\n<li>프록시를 쓰면 Linux는 <code>configureProxy</code>, Windows는 Secure\nAgent Manager의 Proxy 메뉴로 설정한 뒤 Agent를 재시작한다. [Secure Agent\nQuick Start for Linux/Windows]</li>\n<li>Runtime Environments 페이지에서 상태가 \"Up and Running\"인지\n확인한다. \"Not all the services are running\"이면 5–10분 기다린다.\n[Getting started with IICS]</li>\n<li>Administrator &gt; Connections &gt; New Connection에서 Flat File\nConnection을 만든다. Runtime Environment, Directory, Date Format, Code\nPage를 지정하고 Test Connection 후 저장한다. [Getting started with\nIICS]</li>\n<li>Data Integration &gt; New &gt; Mappings &gt; Mapping을 만들고\nSource에 Flat File Connection과 CSV 객체를 지정한 뒤 Preview Data로\n확인한다. Target은 GCS·BigQuery Connection으로 잡는다. [Getting started\nwith IICS]</li>\n<li>Explore 페이지에서 New Project, New Folder로 자산을 정리할\n프로젝트를 만든다. [Getting Started (Data Quality)]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Getting Started (Data Quality)</td>\n<td>Runtime Environment 확인 → Secure Agent 설치 → Explore에서\nProject/Folder 생성 순서. 이름에\n<code># ? ' | { } \" ^ &amp; [ ] / \\</code> 사용 금지</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Getting started with Informatica Intelligent Cloud Services</td>\n<td>GCP Marketplace 활성화부터 Agent 배포, Connection 3종 구성, CSV를\nGCS·BigQuery로 적재하는 Mapping까지 따라 하는 튜토리얼</td>\n</tr>\n<tr>\n<td>3</td>\n<td>IDMC Glossary Of Terms</td>\n<td>IDMC 용어를 알파벳순으로 정리하고 Salesforce Data 360 용어와\n대응시킴(예: credit ↔︎ IPU)</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Organization Administration</td>\n<td>Organization·Sub-organization·License·Metering 외에 Source control,\nSecrets manager, Schedule, CLAIRE 설정까지 다룸</td>\n</tr>\n<tr>\n<td>5</td>\n<td>User Administration</td>\n<td>Native·Salesforce·Azure·SAML 인증, User·User group·Role 구성.\nsystem-defined role은 편집 불가, Admin을 제외하면 복제 가능</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Runtime Environments</td>\n<td>Hosted Agent, Secure Agent group, Elastic, Serverless 런타임 비교와\n클라우드·Windows·Linux별 Agent 설치</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Secure agent quick start for linux</td>\n<td><code>agent64_install_ng_ext.bin</code> 설치 →\n<code>infaagent.sh startup</code> →\n<code>consoleAgentManager.sh configureToken</code>으로 등록</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Secure agent quick start for windows</td>\n<td>설치 후 Secure Agent Manager로 등록하고, Windows 서비스 Log On\n계정으로 네트워크 디렉터리 권한 확보</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Secure Agent Services</td>\n<td>Data Integration Server, Process Server, Elastic Server, Database\nIngestion 등 서비스별 속성을 System Configuration Details에서 조정</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Connections</td>\n<td>Connector와 Connection 관계, add-on connector 설치, 수백 개\nConnector별 연결 속성 레퍼런스</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>Secure Agent는 Task 실행과 운영 메타데이터 업로드를 위해 항상 떠\n있어야 한다. 운영 서버처럼 상시 가동되는 머신에 설치한다.</li>\n<li>설치 경로에 공백이 있으면 Linux 설치가 실패할 수 있다. PowerCenter가\n있는 머신에서는 다른 OS 계정으로 설치해야 환경 변수 충돌을 피한다.</li>\n<li>Connection을 여러 Sub-organization에서 쓰려면 각 Sub-organization에\n따로 만들어야 한다. add-on connector는 상위 조직에만 설치할 수\n있다.</li>\n<li>Sub-organization으로 전환한 상태에서는 Taskflow 생성·게시·실행, data\ntransfer task, dynamic mapping task 생성을 할 수 없다.</li>\n<li>개발팀에는 Connection에 Read만 준 Developer role을 만들고,\nproduction Connection에는 개발 그룹 read 권한을 빼서 운영 데이터 사용을\n막는다(User configuration examples).</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P1 Cloud Data Integration 핵심: 준비한 Runtime Environment와\nConnection 위에서 Mapping, Task, Taskflow를 설계한다.</li>\n</ul>\n"}, {"id": "P1", "title": "Cloud Data Integration (CDI) 핵심", "level": "입문", "track": "Cloud", "goal": "매핑·변환·태스크·태스크플로로 배치 ETL/ELT 파이프라인을 직접 만든다.", "steps": [{"d": "integration-cloud__data-integration__", "f": "_Introduction$", "why": "CDI 개요", "doc": 714}, {"d": "integration-cloud__data-integration__", "f": "_1671_CDI_Quick_Start", "why": "실습: CDI 퀵스타트", "doc": 744}, {"d": "integration-cloud__data-integration__", "f": "_GettingStarted$", "why": "실습: 단계별 튜토리얼", "doc": 721}, {"d": "integration-cloud__data-integration__", "f": "_Components$", "why": "재사용 컴포넌트", "doc": 717}, {"d": "integration-cloud__data-integration__", "f": "DataIntegrationConnections", "why": "CDI 연결 유형", "doc": 728}, {"d": "integration-cloud__data-integration__", "f": "_Mappings$", "why": "매핑 설계·파라미터", "doc": 722}, {"d": "integration-cloud__data-integration__", "f": "_Transformations$", "why": "변환 레퍼런스(핵심)", "doc": 726}, {"d": "integration-cloud__data-integration__", "f": "FunctionReference", "why": "표현식 함수", "doc": 720}, {"d": "integration-cloud__data-integration__", "f": "_Tasks$", "why": "매핑/동기화/복제 태스크", "doc": 725}, {"d": "integration-cloud__data-integration__", "f": "_Taskflows$", "why": "오케스트레이션", "doc": 724}, {"d": "integration-cloud__data-integration__", "f": "1683-how-to-configure-a-parameter-set", "why": "실습: 태스크플로 파라미터 세트", "doc": 738}, {"d": "integration-cloud__data-integration__", "f": "MonitoringDataIntegrationJobs", "why": "작업 모니터링", "doc": 723}, {"d": "integration-cloud__data-integration__", "f": "_AssetManagement$", "why": "자산 관리·소스 컨트롤", "doc": 716}, {"d": "integration-cloud__data-integration__", "f": "_Troubleshooting$", "why": "트러블슈팅", "doc": 727}], "summary": "<h1 id=\"p1-cloud-data-integration-cdi-핵심\">P1. Cloud Data Integration\n(CDI) 핵심</h1>\n<blockquote>\n<p>Mapping, Transformation, Task, Taskflow를 조합해 배치 ETL/ELT\n파이프라인을 직접 만들고 실행·모니터링한다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>Project, Folder, Asset 구조와 Explore 페이지에서 자산을 관리하는\n방법</li>\n<li>Mapping Designer에서 Source → Transformation → Target 데이터 흐름을\n설계하고 Parameter로 재사용하는 방법</li>\n<li>Mapping task, Synchronization task, Replication task 등 Task 유형별\n쓰임새</li>\n<li>Taskflow와 Linear taskflow로 여러 Task의 실행 순서를 제어하는\n방법</li>\n<li>My Jobs 페이지와 로그 파일로 Job을 모니터링하고 문제를 찾는\n방법</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Mapping</td>\n<td>Mapping task에서 재사용하는 데이터 흐름 로직. 서로 다른 시스템의\n소스 조인처럼 Synchronization task로는 안 되는 로직을 정의한다.</td>\n</tr>\n<tr>\n<td>Mapping in advanced mode</td>\n<td>다단계 계층형 데이터, 코드 스니펫, 대규모 워크로드를 처리하는\nMapping. 실행하려면 advanced cluster가 필요하다.</td>\n</tr>\n<tr>\n<td>Transformation</td>\n<td>Mapping 안에서 데이터에 적용하는 연산. 행 수를 바꾸면 active(예:\nFilter), 바꾸지 않으면 passive다.</td>\n</tr>\n<tr>\n<td>Parameter</td>\n<td>실행 시점에 값을 정하는 자리표시자. Input parameter는 Task 설정 시\n값을 넣고, In-out parameter는 실행마다 바뀌는 값(예: 증분 타임스탬프)을\n담는다.</td>\n</tr>\n<tr>\n<td>Mapping task</td>\n<td>Mapping의 로직에 Task 파라미터와 parameter file 값을 더해 실행하는\nTask. Mapping이 먼저 있어야 만들 수 있다.</td>\n</tr>\n<tr>\n<td>Dynamic mapping task</td>\n<td>같은 Mapping으로 파라미터 값이 다른 여러 Job을 한 Task에 묶어\n그룹·순서대로 실행한다. 파라미터가 하나 이상 있는 Mapping만 쓸 수\n있다.</td>\n</tr>\n<tr>\n<td>Synchronization task</td>\n<td>소스와 타겟 간 데이터를 동기화한다. Insert, Update 같은 Task\noperation을 고르고 Database, Flat file, Salesforce를 지원한다.</td>\n</tr>\n<tr>\n<td>Taskflow</td>\n<td>이전 Task 결과에 따라 실행 순서를 제어하는 오케스트레이션 자산. 병렬\n실행, 분기 판단, 대기 시간 설정이 가능하다. Linear taskflow는 지정한\n순서대로 직렬 실행만 한다.</td>\n</tr>\n<tr>\n<td>Mapplet</td>\n<td>Mapping에 넣어 쓰는 재사용 Transformation 로직. PowerCenter\nmapplet을 가져올 수도 있고, 서로를 순환 참조할 수는 없다.</td>\n</tr>\n<tr>\n<td>Job</td>\n<td>Mapping, Task, Taskflow를 실행할 때마다 만들어지는 인스턴스. My Jobs\n페이지에서 상태 확인, 중지·재시작, 로그 다운로드를 한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>Product Availability Matrix로 지원 OS·DB·브라우저를 확인하고 지원\n브라우저로 로그인한다. [CDI Quick Start]</li>\n<li>Administrator &gt; Runtime Environments에서 Secure Agent를 설치한다.\nSaaS 데이터에 접근할 때는 설치가 필요 없는 Hosted Agent를 쓸 수 있다.\n[CDI Quick Start] [Getting Started]</li>\n<li>필요하면 add-on connector를 설치하고 Connections 페이지에서\nConnection을 만든 뒤 테스트한다. [CDI Quick Start]</li>\n<li>(선택) Administrator &gt; Settings에서 source control을 켜고\n저장소를 연결한 뒤 Data Integration에서 객체를 check in 한다. [CDI Quick\nStart]</li>\n<li>Explore 페이지에서 New Project, New Folder로 작업 공간을 만든다.\n폴더는 한 단계까지만 만들 수 있다. [Getting Started]</li>\n<li>Data Integration에서 New &gt; Mapping &gt; Create로 Mapping을 만들고\n소스에서 타겟까지 흐름을 구성한 뒤 실행한다. [CDI Quick Start]</li>\n<li>연습 시나리오: 미국 고객 계정 파일을 Source로 두고, 주(state) 값을\nParameter로 받는 Filter transformation을 넣는다. 타겟 객체도 Parameter로\n만든 뒤 Validate, Test하고 Mapping task로 만든다. [Mappings &gt; Mapping\ntutorial]</li>\n<li>My Jobs 페이지에서 Job 상태를 보고, 오류가 나면 로그 파일을 내려받아\n원인을 찾는다. [CDI Quick Start]</li>\n<li>다음으로 Task, Taskflow, Component를 만들어 본다. [CDI Quick Start\nNext Steps]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Introduction</td>\n<td>Data Integration·Administrator·Monitor 서비스 역할,\nProject·Asset·Template·Explore 페이지 개념</td>\n</tr>\n<tr>\n<td>2</td>\n<td>CDI Quick Start</td>\n<td>시스템 요구사항 확인 → Runtime Environment → Connection → source\ncontrol(선택) → Mapping 실행 → My Jobs 모니터링의 6단계</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Getting Started</td>\n<td>Hosted Agent가 가장 빠른 선택지. Primary cloud data warehouse를\n지정하면 SQL ELT mode Mapping의 타겟이 자동 설정됨</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Components</td>\n<td>API collection, Business service, File listener, Mapplet, Saved\nquery, Shared sequence, User-defined function 같은 재사용 자산</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Data Integration Connections</td>\n<td>FTP/SFTP는 원격이 아닌 Secure Agent 로컬 디렉터리의 파일로 구조를\n검증. REST V3, LLM, SAP BAPI 연결 속성</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Mappings</td>\n<td>Mapping, advanced mode, SQL ELT mode 비교. Mapping tutorial,\nInput/In-out parameter, CLAIRE recommendations</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Transformations</td>\n<td>Source·Target부터 Aggregator, Expression, Filter, Joiner, Lookup,\nRouter, Python, Vector Embedding까지 Transformation별 레퍼런스</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Function Reference</td>\n<td>연산자 우선순위(Complex → Arithmetic → String → Comparison →\nLogical), 날짜 포맷 문자열, 함수 카테고리, 시스템 변수</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Tasks</td>\n<td>Mapping, Dynamic mapping, Synchronization, Data transfer,\nReplication, Masking, PowerCenter task의 용도와 operation</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Taskflows</td>\n<td>조건·병렬·대기를 쓰는 Taskflow와 직렬 실행만 하는 Linear taskflow의\n차이. Task는 미리 만들어 두어야 함</td>\n</tr>\n<tr>\n<td>11</td>\n<td>How to configure a parameter set in a taskflow</td>\n<td>ParamSetCli로 parameter file을 클라우드 저장소에 올려 parameter\nset으로 사용. 범위가 좁은 섹션 값이 우선</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Monitoring Data Integration Jobs</td>\n<td>My Jobs·Job Details 페이지, error rows file과 session log,\nImport/Export 로그는 7일간 다운로드 가능</td>\n</tr>\n<tr>\n<td>13</td>\n<td>Asset Management</td>\n<td>Explore 페이지 자산 관리, Git 기반 source control, 조직 간\nexport/import 마이그레이션, Bundle</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Troubleshooting</td>\n<td>Secure Agent, Connection, Mapping task, Synchronization task,\nadvanced cluster 등 대상별 문제 해결 항목</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>Filter transformation은 소스 가까이 두어 불필요한 행을 일찍 걸러야\n성능이 좋아진다.</li>\n<li>SQL ELT mode Mapping에서는 Informatica 함수 대신 대상 클라우드 DW의\n네이티브 함수와 문법을 쓴다. User-defined function도 쓸 수 없다.</li>\n<li>Connection parameter로 Mapping task에서 쓸 Connection을 고를 수는\n있다. Connection 속성 자체는 파라미터로 만들 수 없다.</li>\n<li>CDC나 Kafka 같은 실시간 소스를 Dynamic mapping task에 넣으면 같은\n그룹과 뒤 그룹의 Job이 늦어질 수 있다. 이런 경우는 Mapping task로\n분리한다.</li>\n<li>Parameter set의 값은 <code>=</code> 뒤 모든 문자(앞뒤 공백 포함)를\n문자열로 읽는다. 연결 비밀번호 같은 민감 정보는 별도 parameter file로\n나눈다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P2 커넥터 &amp; 데이터 수집/복제: Snowflake, Databricks, S3,\nSalesforce 등 주요 Connector와 Data Ingestion and Replication으로 범위를\n넓힌다.</li>\n</ul>\n"}, {"id": "P2", "title": "커넥터 & 데이터 수집/복제 (CMI·DIR)", "level": "중급", "track": "Cloud", "goal": "주요 소스/타깃 커넥터를 익히고 DB·애플리케이션·파일·스트리밍 수집과 CDC 복제를 구성한다.", "steps": [{"d": "data-integration-connectors", "f": "SnowflakeDataCloudConnector", "why": "가장 많이 쓰는 클라우드 DW", "doc": 559}, {"d": "data-integration-connectors", "f": "^__DatabricksConnector", "why": "Lakehouse", "doc": 504}, {"d": "data-integration-connectors", "f": "AmazonS3V2Connector", "why": "오브젝트 스토리지", "doc": 488}, {"d": "data-integration-connectors", "f": "AzureDataLakeStorageGen2Connector", "why": "Azure 스토리지", "doc": 527}, {"d": "data-integration-connectors", "f": "GoogleBigQueryConnectors", "why": "GCP DW", "doc": 508}, {"d": "data-integration-connectors", "f": "^__OracleConnector", "why": "온프렘 RDBMS 대표", "doc": 546}, {"d": "data-integration-connectors", "f": "^__Microsoft\\(SQL\\)ServerConnector", "why": "SQL Server", "doc": 524}, {"d": "data-integration-connectors", "f": "^__SalesforceConnector", "why": "SaaS 대표", "doc": 550}, {"d": "data-integration-connectors", "f": "^__\\(REST\\)V2Connector", "why": "REST API 소스", "doc": 467}, {"d": "data-ingestion-and-replication", "f": "IntroductionToDataIngestion", "why": "CMI/DIR 개요", "doc": 354}, {"d": "data-ingestion-and-replication", "f": "GettingStartedWithDataIngestion", "why": "실습: 시작하기", "doc": 362}, {"d": "data-ingestion-and-replication", "f": "1452-Mass_Ingestion_Databases_QuickStart", "why": "실습: DB 수집 퀵스타트", "doc": 369}, {"d": "data-ingestion-and-replication", "f": "_DatabaseIngestionAndReplication$", "why": "DB 수집·CDC", "doc": 361}, {"d": "data-ingestion-and-replication", "f": "ApplicationIngestionAndReplication", "why": "SaaS 앱 수집", "doc": 356}, {"d": "data-ingestion-and-replication", "f": "FileIngestionAndReplication", "why": "파일 수집", "doc": 365}, {"d": "data-ingestion-and-replication", "f": "1328-streaming-ingestion-quick-start", "why": "실습: 스트리밍 퀵스타트", "doc": 367}, {"d": "data-ingestion-and-replication", "f": "StreamingIngestionAndReplication", "why": "Kafka 등 스트리밍", "doc": 366}, {"d": "data-ingestion-and-replication", "f": "MonitoringDataIngestion", "why": "수집 작업 모니터링", "doc": 363}], "summary": "<h1 id=\"p2-커넥터--데이터-수집복제-cmidir\">P2. 커넥터 &amp; 데이터\n수집/복제 (CMI·DIR)</h1>\n<blockquote>\n<p>주요 DW·스토리지·DB·SaaS Connector를 다루고, Data Ingestion and\nReplication으로 DB·애플리케이션·파일·스트리밍 데이터를 수집하고 CDC\n복제를 구성한다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>Snowflake, Databricks, Amazon S3 V2, ADLS Gen2, Google BigQuery,\nOracle, SQL Server, Salesforce, REST V2 Connector의 연결 준비와 Mapping\n사용법</li>\n<li>SQL ELT로 변환 로직을 클라우드 DW 안에서 실행하는 방식</li>\n<li>Data Ingestion and Replication의 네 가지 수집 유형(Database,\nApplication, File, Streaming)과 쓰임새</li>\n<li>Initial load, Incremental load, 둘을 결합한 load type의 차이와\nschema drift 처리</li>\n<li>수집 Task를 Deploy해 Job으로 만들고 My Jobs와 Monitor에서 추적하는\n흐름</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Connector / Connection</td>\n<td>Connector는 엔드포인트별 통합 모듈이고 Connection은 그것으로 만든\n접속 정보다. S3 V2, ADLS Gen2는 Connection을 만들기 전에 Runtime\nEnvironment에서 Connector를 활성화해야 한다.</td>\n</tr>\n<tr>\n<td>SQL ELT</td>\n<td>변환 로직을 대상 생태계의 명령과 SQL로 바꿔 클라우드 안에서\n실행한다. 데이터가 클라우드 밖으로 나가지 않아 처리가 빨라진다.</td>\n</tr>\n<tr>\n<td>Staging</td>\n<td>Databricks처럼 읽기·쓰기 중간에 데이터를 두는 영역. Databricks는\nAWS, Azure, Databricks Volume 중에서 고르며, GCP 호스팅이면 Volume을\n써야 한다.</td>\n</tr>\n<tr>\n<td>Swagger / OpenAPI 파일</td>\n<td>REST V2 Connection에 필요한 JSON 형식 명세. Swagger 2.0, OpenAPI\n3.0.x를 지원하고, 없으면 Administrator &gt; Swagger Files에서\n만든다.</td>\n</tr>\n<tr>\n<td>Database Ingestion and Replication</td>\n<td>관계형 DB에서 클라우드 DW, 데이터 레이크, 스트리밍, 다른 DB로\n데이터를 수집하고 DML·스키마 변경을 거의 실시간으로 복제한다.</td>\n</tr>\n<tr>\n<td>Application Ingestion and Replication</td>\n<td>SaaS·온프레미스 애플리케이션 객체를 DB, 데이터 레이크, DW, 이벤트\n스트리밍 플랫폼으로 옮긴다.</td>\n</tr>\n<tr>\n<td>File / Streaming Ingestion and Replication</td>\n<td>File은 대량 파일을 온프레미스와 클라우드 저장소 사이에서 옮기고\n추적한다. Streaming은 로그, 클릭스트림, IoT 같은 실시간 데이터를 메시징\n시스템과 배치 타겟으로 보낸다.</td>\n</tr>\n<tr>\n<td>Load type</td>\n<td>Initial load는 특정 시점 스냅샷, Incremental load는 변경분 연속\n전파, combined는 초기 적재 후 자동으로 증분 처리로 넘어간다.</td>\n</tr>\n<tr>\n<td>Schema drift</td>\n<td>소스의 컬럼 추가·변경·삭제·이름 변경을 감지해 타겟에 반영하는 처리.\n무시, 복제, Job 중지 중에서 고른다.</td>\n</tr>\n<tr>\n<td>Deploy / Job</td>\n<td>수집 Task는 저장 후 Deploy해야 실행 가능한 Job 인스턴스가 된다.\nDeploy할 때 Task 정의도 검증한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>시스템 요구사항을 확인한다. Database Ingestion and Replication\n요구사항 문서, PAM, 지원 소스·타겟 KB 문서를 본다. [Getting Started With\nData Ingestion And Replication]</li>\n<li>Administrator에서 Secure Agent를 내려받아 설치·등록한다. 필요하면\nAgent를 편집해 Database Ingestion 서비스의\n<code>DBMI_AGENT_CONFIG</code>를 조정한다. [Mass Ingestion Databases\nQuick Start]</li>\n<li>Connections &gt; New Connection에서 소스 Connection을 만들어\n테스트·저장하고, 같은 방법으로 타겟 Connection을 만든다. 먼저 해당\nConnector가 쓸 수 있는 상태인지 확인한다. [Mass Ingestion Databases\nQuick Start]</li>\n<li>New &gt; Database Ingestion Task로 마법사를 열고 기본 정보, 소스,\n타겟, runtime option을 차례로 설정한다. [Mass Ingestion Databases Quick\nStart]</li>\n<li>Save 후 Deploy한다. 구조가 다른 타겟 객체가 이미 있으면 먼저 지운다.\n테이블은 Job 실행 시 다시 생성된다. [Mass Ingestion Databases Quick\nStart]</li>\n<li>My Jobs에서 Job을 선택하고 Actions &gt; Run으로 실행한다. Job\nOverview 탭에서 상태를, Object Detail 탭에서 테이블별 처리 통계를 본다.\n[Mass Ingestion Databases Quick Start]</li>\n<li>Monitor의 Overview 탭에서 Job 유형·상태로 걸러 보고, All Jobs 탭에서\n실패한 Job의 error log를 내려받는다. [Mass Ingestion Databases Quick\nStart]</li>\n<li>스트리밍 실습: Agent와 소스·타겟 Connection을 준비하고 streaming\ningestion task를 만든다. 소스, 타겟, 선택적 transformation, runtime\noption을 설정한 뒤 Deploy하고 My Jobs에서 모니터링한다. [Streaming\ningestion quick start]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Snowflake Data Cloud Connector</td>\n<td>Connection, Source·Target·Lookup, SQL ELT mode Mapping, mapping\ntask용 SQL ELT optimization, CDC 쓰기 최적화</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Databricks Connector</td>\n<td>SQL warehouse, all-purpose cluster, job cluster별 staging 사전 준비.\nGCP 호스팅 엔드포인트는 Databricks Volumes staging 필수</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Amazon S3 V2 Connector</td>\n<td>Avro·flat·binary·ORC·Parquet 지원. Windows에서는 Avro, JSON, ORC,\nParquet을 읽고 쓸 수 없음</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Microsoft Azure Data Lake Storage Gen2 Connector</td>\n<td>Shared Key, Managed Identity, Service Principal 인증. Delta·Iceberg\n포맷, Document 포맷으로 PDF 읽기</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Google BigQuery Connectors</td>\n<td>BigQuery V2와 기존 BigQuery Connector 비교, V2 업그레이드, SQL\nELT</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Oracle Connector</td>\n<td>Synchronization, Mapping, Replication task 지원. Hosted Agent에서는\nSSL 인증을 설정할 수 없음</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Microsoft SQL Server Connector</td>\n<td>Azure SQL Database, Managed Instance, RDS SQL Server까지 연결. key\nrange·pass-through partitioning</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Salesforce Connector</td>\n<td>Standard, OAuth, OAuth - JWT 연결 유형. Standard는 security token\n또는 trusted IP 등록 필요, Bulk API 지원</td>\n</tr>\n<tr>\n<td>9</td>\n<td>REST V2 Connector</td>\n<td>Source, Target, Web Services transformation(midstream)에서 사용.\n인증 5종과 paging 지원</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Introduction To Data Ingestion And Replication</td>\n<td>네 가지 수집 유형 정의와 Home 페이지의 Ingest, Transform,\nOrchestrate 패널</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Getting Started With Data Ingestion And Replication</td>\n<td>요구사항 확인 → 조직 설정 → Secure Agent·서비스 → Agent failover →\nServerless → 프로젝트 생성 순서</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Mass Ingestion Databases Quick Start R34</td>\n<td>Agent 설정 → Connection → Task 마법사 → Deploy → Run → Monitor로\n이어지는 DB 수집 전 과정</td>\n</tr>\n<tr>\n<td>13</td>\n<td>Database Ingestion And Replication</td>\n<td>Agent 최소 사양 8코어(대량 initial load는 16 권장), 메모리 32 GB,\nJob당 디스크 5 GB(행 2 KB 기준)</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Application Ingestion And Replication</td>\n<td>SaaS·온프레미스 앱 데이터를 initial, incremental, combined load로\n대용량 타겟에 적재</td>\n</tr>\n<tr>\n<td>15</td>\n<td>File Ingestion And Replication</td>\n<td>파일 일괄 전송, 스케줄, 압축·암호화 동작. REST API base URL은\n<code>&lt;serverUrl&gt;/mftsaas/api/v1/</code></td>\n</tr>\n<tr>\n<td>16</td>\n<td>Streaming ingestion quick start</td>\n<td>소스는 event log, Apache Kafka, MQTT, 타겟은 Amazon Kinesis, Apache\nKafka, Amazon S3 (2019년 기준 문서)</td>\n</tr>\n<tr>\n<td>17</td>\n<td>Streaming Ingestion And Replication</td>\n<td>별도 라이선스가 필요한 수집 유형. REST API로 Task\n생성·배포·시작·중지</td>\n</tr>\n<tr>\n<td>18</td>\n<td>Monitoring Data Ingestion And Replication Jobs</td>\n<td>내 Job과 전체 Job 모니터링, Job 속성, Job 상세 보기</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>Database ingestion and replication task는 Hosted Agent에서 돌지\n않는다. 로컬 Secure Agent를 쓰거나 일부 소스·load type에 한해 Azure\n호스팅 Serverless를 쓴다. AWS 호스팅 Serverless는 지원하지 않는다.</li>\n<li>Azure Synapse Analytics나 Snowflake 타겟 Task를 Deploy하기 전에,\n소스와 구조가 달라진 기존 타겟 테이블은 지워야 한다. Deploy할 때 최신\n소스 구조로 테이블을 다시 만든다.</li>\n<li>Incremental load Job은 중지할 때 checkpoint를 먼저 남긴다.\ncheckpoint는 증분 처리가 멈춘 변경 스트림 위치를 복구용으로\n기록한다.</li>\n<li>S3 V2로 대량 레코드를 쓰다가\n<code>OutOfMemoryError: GC overhead limit exceeded</code>가 나면 Secure\nAgent의 Data Integration Server JVM 옵션에서 힙을 늘린다.</li>\n<li>Quick Start 문서는 예전 서비스 이름(Mass Ingestion, Data\nIngestion)을 쓴다. 현재 가이드에서는 같은 기능을 Data Ingestion and\nReplication이라고 부른다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P3 Application Integration &amp; API: 수집한 데이터를 프로세스와\nAPI로 연결하는 Application Integration으로 넘어간다.</li>\n</ul>\n"}, {"id": "P3", "title": "Application Integration & API", "level": "중급", "track": "Cloud", "goal": "프로세스·서비스 커넥터로 실시간 연동을 만들고 API Center로 API를 관리한다.", "steps": [{"d": "ipaas__application-integration", "f": "_Introduction$", "why": "CAI 개요", "doc": 807}, {"d": "ipaas__application-integration", "f": "_GettingStarted$", "why": "실습: 시작하기", "doc": 834}, {"d": "ipaas__application-integration", "f": "TutorialHelloWorld", "why": "실습: Hello World 프로세스", "doc": 809}, {"d": "ipaas__application-integration", "f": "TutorialCalculator", "why": "실습: 서비스 커넥터", "doc": 816}, {"d": "ipaas__application-integration", "f": "TutorialOrderManagement", "why": "실습: 주문 관리 시나리오", "doc": 815}, {"d": "ipaas__application-integration", "f": "_Design$", "why": "프로세스 설계", "doc": 832}, {"d": "ipaas__application-integration", "f": "_ProcessDeveloper$", "why": "프로세스 개발 심화", "doc": 839}, {"d": "ipaas__application-integration", "f": "_Invoke$", "why": "프로세스 호출 방식", "doc": 837}, {"d": "ipaas__application-integration", "f": "_Monitor$", "why": "모니터링", "doc": 838}, {"d": "ipaas__api-center", "f": "Introducing\\(API\\)Center", "why": "API Center 개요", "doc": 766}, {"d": "ipaas__api-center", "f": "Manage\\(API\\)S", "why": "API 관리", "doc": 770}, {"d": "ipaas__api-center", "f": "\\(API\\)Policies", "why": "API 정책", "doc": 765}, {"d": "ipaas__recipes", "f": "GettingStartedWithRecipes", "why": "실습: 레시피(템플릿) 활용", "doc": 889}], "summary": "<h1 id=\"p3-application-integration--api\">P3. Application Integration\n&amp; API</h1>\n<blockquote>\n<p>Process와 Service Connector로 REST/SOAP 서비스를 엮어 실시간 연동을\n만들고, 게시한 Process를 API Center에서 Managed API로 감싸 정책을 걸고\n운영하는 단계다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>Process Designer(BPMN 기반)에서 Start/End 사이에 step을 끌어다 놓아\nProcess를 설계하고 게시·호출하는 흐름</li>\n<li>WSDL·Swagger·OpenAPI 3.0 파일을 가져와 Service Connector와 App\nConnection을 만드는 방법</li>\n<li>Parallel Paths, Subprocess, Fault Handling(Catch Faults)으로\n분기·재사용·오류 처리를 넣는 방법</li>\n<li>Application Integration Console에서 프로세스 인스턴스, 스케줄, API\n활성 상태, 리스너 이벤트 소스를 관리하는 방법</li>\n<li>API Center에서 Published API → Managed API를 만들고 Security·Rate\nlimit·CORS·IP filtering 정책을 거는 방법</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Process</td>\n<td>비즈니스 프로세스를 자동화하는 asset. HTTPS 기반이면 게시 시\nREST/SOAP API가 생기고, 이벤트 기반이면 이벤트 발생 시 실행된다.</td>\n</tr>\n<tr>\n<td>Guide</td>\n<td>사용자가 자주 거치는 화면 흐름을 자동화하는 asset. 게시하면 embed\ncode가 생성돼 서드파티 앱에 넣을 수 있다.</td>\n</tr>\n<tr>\n<td>Service Connector</td>\n<td>REST/SOAP API를 노출한 서비스와 통신하는 정의. 직접 만들거나\nWSDL·Swagger·OpenAPI 파일을 import하거나\nGitHub·Marketplace·Administrator에서 내려받는다.</td>\n</tr>\n<tr>\n<td>App Connection</td>\n<td>Service Connector나 native connector를 Process·Guide에서 쓰기 위한\n연결. 별도로 게시해야 한다.</td>\n</tr>\n<tr>\n<td>Process Object</td>\n<td>이름·주소·전화번호처럼 묶인 구조화 데이터를 정의한 객체.\nstandalone으로 만들면 여러 Process에서 재사용한다.</td>\n</tr>\n<tr>\n<td>Cloud Server / Secure Agent</td>\n<td>Process를 배포·실행하는 런타임. Cloud Server, 특정 Secure Agent,\nSecure Agent group 중 하나에 배포해 호출한다.</td>\n</tr>\n<tr>\n<td>Fault Handling</td>\n<td>step의 Fault Handling 탭에서 Catch Faults를 켜면 fault/no fault 두\n분기가 생긴다. HTTPS 500 대신 정의한 값을 돌려줄 수 있다.</td>\n</tr>\n<tr>\n<td>Application Integration Console</td>\n<td>런타임 모니터링 화면. 인스턴스 상태(Running, Suspended, Completed,\nCompensatable, Faulted), 스케줄, APIs, Connections, Logs를 본다.</td>\n</tr>\n<tr>\n<td>Managed API</td>\n<td>인증 방식과 사용 정책을 통일한 API. Published API를 골라 만들고\n활성화하면 API Center가 endpoint URL을 생성한다.</td>\n</tr>\n<tr>\n<td>API Policy</td>\n<td>Security, CORS, Operational(Rate limit·Response caching),\nPrivacy(PII), IP filtering 정책. API나 operation에 할당한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>Product Availability Matrix로 브라우저 호환성을 확인하고 runtime\nenvironment(Secure Agent 1개 이상)를 준비한다. Explore 페이지에서\nProject와 Folder를 만든다. [Getting Started]</li>\n<li>New &gt; Processes &gt; Process로 Process를 만들고 Start step에서\n속성과 Output을 설정한다. Save·Publish 후 호출하고 Application\nIntegration Console에서 실행 결과를 확인한다. 두 번째 Process는 입력\n텍스트를 받아 그대로 출력한다. [Tutorial Hello World]</li>\n<li>Service Connector from WSDL로 calculator 웹서비스 커넥터를 만들고\nTest Actions로 확인한 뒤 App Connection을 만든다. [Tutorial\nCalculator]</li>\n<li>두 정수를 입력받아 Add·Subtract·Multiply·Divide를 병렬로 실행하는\nProcess를 만든다. Properties Detail에서 Service URL을 복사해 10/5,\n8/0으로 호출해 본다. [Tutorial Calculator]</li>\n<li>Divide Service step에 Catch Faults를 켜고 Output을 고친다. 8/0\n재호출 시 Sum 8, Difference 8, Product 0, Quotient Fault가 나오고,\nConsole에서 process version이 하나 올라간 것을 확인한다. [Tutorial\nCalculator]</li>\n<li>(선택) JDBC Connection을 만들고 Create step으로 결과를\ncalculatorArchive 테이블에 보관한다. [Tutorial Calculator]</li>\n<li>Explore &gt; Import로 Get Inventory Detail 커넥터·연결을 가져오고,\nSwagger로 Margin·Email Service Connector를 만든다. Temporary Field와\nAssign으로 입력을 구성한다. [Tutorial Order Management]</li>\n<li>Send Email Process를 Subprocess로 Parallel Paths 두\n분기(소비자·공급자)에 넣는다. 없는 ItemName으로 fault를 재현한 뒤 Get\nInventory Detail step에 Catch Faults를 건다. [Tutorial Order\nManagement]</li>\n<li>API Manager의 API Registry에서 Order_Management Process로 Create\nManaged API를 실행하고 managed API로 호출한다. [Tutorial Order\nManagement]</li>\n<li>Recipes 메뉴에서 recipe를 검색·복사하고 App Connection 인증과\nruntime environment를 설정한 뒤 asset을 게시한다. [Getting Started With\nRecipes]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Introduction</td>\n<td>Designer, Process Server, Application Integration Console, Cloud\nServer, Process Developer 다섯 컴포넌트와 asset 종류</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Getting Started</td>\n<td>Quick Start: 시스템 요건 확인 → runtime environment 구성. 프로젝트\n안에는 폴더를 한 단계만 만들 수 있다</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Tutorial Hello World</td>\n<td>고정 출력 Process와 입력 메시지 출력 Process를 만들어\n게시·호출·Console 확인까지 한 바퀴</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Tutorial Calculator</td>\n<td>WSDL import로 Service Connector 생성, 병렬 경로 4개, Divide step\nFault Handling</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Tutorial Order Management</td>\n<td>Swagger 커넥터, Temporary Field, Subprocess, Parallel Paths, Managed\nAPI 생성까지 이어지는 시나리오</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Design</td>\n<td>데이터 타입·필드 속성, Process·Guide·Process Object·Service\nConnector·App Connection·Human Task 설계</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Process Developer</td>\n<td>BPEL/BPMN 기반 데스크톱 개발 도구. Correlation, Compensation, BPEL\nUnit Testing, .bpr 배포</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Invoke</td>\n<td>게시하면 service endpoint URL과 Swagger·OpenAPI 3.0·WSDL 파일이\n생성된다. HTTP verb 호출, bulk publish/unpublish</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Monitor</td>\n<td>Console의 Processes·Process Schedules·APIs·Connections·Logs 페이지와\nProcess Server Health</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Introducing API Center</td>\n<td>IDMC에서 API를 설계·게시·관리·모니터링하는 서비스. 처음 로그인 시\nAPI domain name을 정한다</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Manage APIs</td>\n<td>Published API는 top-down(operation 설계) 또는 bottom-up(기존\nProcess) 방식으로 만든다. Managed API·API Group 수명주기</td>\n</tr>\n<tr>\n<td>12</td>\n<td>API Policies</td>\n<td>Basic, OAuth 2.0(client credentials), JWT, Session ID 인증과 Rate\nlimit·Caching·PII·IP filtering 정책</td>\n</tr>\n<tr>\n<td>13</td>\n<td>Getting Started With Recipes</td>\n<td>recipe는 process object, app connection, process를 미리 구성해 둔\n묶음. 복사 후 인증·runtime 설정이 필요하다</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>Project, folder, asset, tag 이름에\n<code># ? ' | { } \" ^ &amp; [ ] / \\</code> 문자를 쓸 수 없다. [Getting\nStarted]</li>\n<li>bulk publish/unpublish는 한 번에 최대 199개 asset까지이고\nINFA-SESSION-ID 헤더가 필요하다. 게시 후 수정한 Guide는 다시 게시하지\n않으면 Outdated 상태로 남는다. [Invoke]</li>\n<li>APIs 페이지에서 비활성화한 API는 Process를 재게시해도 다시 켜지지\n않는다. APIs 페이지에서 직접 activate해야 한다. [Monitor]</li>\n<li>Rate limit 기본값은 조직 단위 분당 1,000건, 최대 분당 10,000건이다.\nResponse caching timeout은 최대 3,600초이고 upstream 응답이 압축돼\n있으면 캐시가 동작하지 않는다. [API Policies]</li>\n<li>같은 API에 IP filtering allow 규칙과 deny 규칙을 섞어 쓸 수 없다.\n요청 IP와 처음 일치하는 규칙이 적용된다. [API Policies]</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P4 CDI 심화 &amp; 운영: 성능 튜닝, Advanced Cluster, REST API\n자동화, 데이터 검증으로 운영 수준을 올린다.</li>\n</ul>\n"}, {"id": "P4", "title": "CDI 심화 & 운영", "level": "심화", "track": "Cloud", "goal": "성능 튜닝·Advanced Cluster(Elastic)·REST API 자동화·데이터 검증으로 운영 수준을 높인다.", "steps": [{"d": "cloud-common-services__administrator", "f": "DataIntegrationPerformanceTuning", "why": "성능 튜닝", "doc": 3}, {"d": "integration-cloud__data-integration__", "f": "1515-secure-agent-best-practices", "why": "Agent 튜닝 베스트 프랙티스", "doc": 736}, {"d": "cloud-common-services__administrator", "f": "AdvancedClusters", "why": "Advanced Cluster(Elastic)", "doc": 0}, {"d": "integration-cloud__data-integration__", "f": "1439-data-integration-elastic-quick-reference", "why": "Elastic 퀵 레퍼런스", "doc": 733}, {"d": "integration-cloud__data-integration__", "f": "_1309-IntegrationAtScaleQuickStart", "why": "실습: Integration at Scale", "doc": 743}, {"d": "integration-cloud__data-integration__", "f": "1856-data-vault-mapping-task-template", "why": "실습: Data Vault 튜토리얼", "doc": 742}, {"d": "integration-cloud__data-integration__", "f": "\\(REST-API\\)Reference", "why": "REST API 자동화", "doc": 729}, {"d": "cloud-common-services__monitor", "f": "_Monitor$", "why": "통합 모니터링", "doc": 40}, {"d": "operational-insights", "f": "OP_.*_OperationalInsights$", "why": "운영 인사이트", "doc": 43}, {"d": "integration-cloud__data-validation", "f": "IntroducingDataValidation", "why": "데이터 검증", "doc": 751}, {"d": "integration-cloud__data-integration__", "f": "CopilotForDataIntegration", "why": "CLAIRE Copilot으로 매핑 생성", "doc": 715}], "summary": "<h1 id=\"p4-cdi-심화--운영\">P4. CDI 심화 &amp; 운영</h1>\n<blockquote>\n<p>병목을 찾아 매핑과 Secure Agent를 튜닝하고, Advanced Cluster에서\nadvanced mode 매핑을 돌리며, REST API·RunAJob으로 작업을 자동화하고 Data\nValidation으로 결과를 검증하는 단계다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>thread statistics와 Filter transformation으로\nsource·target·mapping·system 병목을 찾아 하나씩 제거하는 튜닝 절차</li>\n<li>Secure Agent의 maxDTMProcesses, JVM 옵션, Linux ulimit, Amazon S3\n파라미터 조정 기준</li>\n<li>fully-managed·self-service·local Advanced Cluster 구성과 advanced\nmode 매핑 실행·모니터링</li>\n<li>Platform REST API v2/v3, Data Integration REST API,\nRunAJob·ParamSetCli 유틸리티로 작업 자동화</li>\n<li>Monitor·Operational Insights로 작업을 감시하고 Data\nValidation·CLAIRE Copilot을 운영에 붙이는 방법</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bottleneck</td>\n<td>성능 저하 지점. target, source, transformation, system 중 어디인지\nsession log의 thread statistics(reader/transformation/writer 시간)로\n판단한다.</td>\n</tr>\n<tr>\n<td>Buffer memory</td>\n<td>task 실행 시 source·target partition마다 최소 2블록씩 할당하는\n메모리. 블록이 부족하면 task가 실패한다. 직접 지정하거나 run time\n계산으로 둔다.</td>\n</tr>\n<tr>\n<td>maxDTMProcesses</td>\n<td>Data Integration Server의 custom property. 기본은 mapping task 2개만\n동시에 돌고 나머지는 대기한다. 값을 올려 동시 실행 수를 늘린다.</td>\n</tr>\n<tr>\n<td>Advanced cluster</td>\n<td>클라우드에서 분산 처리를 제공하는 Kubernetes 클러스터.\nfully-managed, self-service, local 세 유형이 있다.</td>\n</tr>\n<tr>\n<td>Advanced configuration</td>\n<td>클러스터와 클라우드 리소스를 정의하는 속성 묶음. Administrator의\nAdvanced Clusters 페이지에서 만들고 runtime environment와 연결한다.</td>\n</tr>\n<tr>\n<td>Mapping in advanced mode</td>\n<td>Mapping Designer에서 Switch to Advanced로 전환한 매핑.\ntransformation마다 runtime plan이 정해져 advanced cluster나 Data\nIntegration Server에서 실행된다.</td>\n</tr>\n<tr>\n<td>REST API v2 / v3</td>\n<td>v2는 serverUrl + /api/v2, 헤더 icSessionId를 쓴다. v3는 baseApiUrl +\n/public/core/v3, 헤더 INFA-SESSION-ID를 쓰고 JSON만 받는다.</td>\n</tr>\n<tr>\n<td>RunAJob utility</td>\n<td>REST API를 직접 부르지 않고 mapping task, taskflow 등을 실행·상태\n확인하는 CLI. RunAJobCli 패키지 라이선스가 있어야 한다.</td>\n</tr>\n<tr>\n<td>Operational Insights</td>\n<td>IDMC 서비스(Data Integration, Application Integration 등)와 on-prem\nPowerCenter·DEI·DQ 도메인을 함께 모니터링하는 서비스</td>\n</tr>\n<tr>\n<td>Data Validation test case</td>\n<td>두 데이터셋(source·target)을 비교하는 테스트. 리포트에서 unmatched,\nmissing, extra 데이터를 확인한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>클라우드 VM에 Secure Agent를 설치하고 클러스터 유형과 플랫폼(AWS,\nGoogle Cloud, Microsoft Azure, self-service, local)에 맞게 환경을\n준비한다. [Integration At Scale Quick Start]</li>\n<li>Administrator &gt; Advanced Clusters에서 advanced configuration을\n만들고 클러스터를 정의할 클라우드 리소스를 설정한다. [Integration At\nScale Quick Start]</li>\n<li>Data Integration에서 New &gt; Mapping을 만들고 Mapping Designer에서\nSwitch to Advanced를 눌러 source → target 흐름을 정의한다. [Integration\nAt Scale Quick Start]</li>\n<li>Actions &gt; New Mapping Task로 task를 만들고 advanced\nconfiguration이 연결된 runtime environment를 선택해 Run한다.\n[Integration At Scale Quick Start]</li>\n<li>My Jobs에서 job을 열고 advanced cluster에서 돈 subtask로 내려가\n결과와 Spark task details를 확인한다. [Integration At Scale Quick\nStart]</li>\n<li>Monitor &gt; Advanced Clusters에서 클러스터를 골라 activity\nlog(기동·auto-scaling 이벤트)와 lifecycle graph(worker node 수 변화)를\n본다. 여기서 보는 advanced configuration은 read-only다. [Integration At\nScale Quick Start]</li>\n<li>Templates 페이지에서 Data Vault – Hub tile로 mapping task를 만든다.\nlanding table과 hub table을 source로, hub table을 target(Insert)으로\n지정한다. [Data vault mapping task template configuration tutorial]</li>\n<li>Input parameters에서 Hub Key\n<code>TO_CHAR(TRUNC(CUSTOMER_ID))</code>, Filter Existing Records\n<code>IIF(ISNULL(BK_CUSTOMER_ID),TRUE, FALSE)</code>를 입력한다. [Data\nvault mapping task template configuration tutorial]</li>\n<li>Data Vault – Link 템플릿으로 주문·고객 hash key를 MD5로 계산하고\nLink Key를 <code>MD5(Concat(...))</code>로 만든다. 기존 관계는 다시\ninsert하지 않는다. [Data vault mapping task template configuration\ntutorial]</li>\n<li>Data Vault – Satellite 템플릿에서 Insert·Update 두 target을 설정하고\nChange Compare 식으로 I/U/X를 판정해 변경 이력을 적재한다. [Data vault\nmapping task template configuration tutorial]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Data Integration Performance Tuning</td>\n<td>변수는 한 번에 하나만 바꾸고 변경 전후 실행 시간을 잰다. flat file\ntarget으로 바꿔 빨라지면 target 병목이다</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Secure agent best practices and tuning guidelines</td>\n<td>maxDTMProcesses 권장값: file·ODBC는 논리 CPU × 0.75, cloud DW·data\nlake는 × 0.33</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Advanced Clusters</td>\n<td>클라우드 환경 준비 → Administrator에서 advanced configuration 생성 →\nMonitor에서 클러스터 상태 확인의 3단계</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Data integration elastic quick reference</td>\n<td>advanced configuration이 없는 runtime environment에서도 agent가\nlocal cluster를 만들어 개발·테스트할 수 있다</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Integration At Scale Quick Start</td>\n<td>환경 준비부터 Monitor의 activity log·lifecycle graph 확인까지 첫\n클러스터 구성 순서</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Data vault mapping task template configuration tutorial</td>\n<td>Hub·Link·Satellite 파라미터 템플릿으로 Snowflake 테이블에 Data Vault\n모델을 적재</td>\n</tr>\n<tr>\n<td>7</td>\n<td>REST API Reference</td>\n<td>Platform v2/v3, Data Integration, Data Ingestion and Replication,\nCDI-PC API와 RunAJob·ParamSetCli 유틸리티</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Monitor</td>\n<td>All Jobs, Running Jobs, My Jobs 페이지와 job log(error rows file,\nsession log), advanced cluster 모니터링</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Operational Insights</td>\n<td>IDMC 서비스 모니터링(Part II)과 on-prem 도메인 등록·모니터링(Part\nIII)</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Introducing Data Validation</td>\n<td>Cloud Data Validation, DVProcessor 등 필요한 라이선스 목록과 test\ncase, test suite, test case monitoring 구성</td>\n</tr>\n<tr>\n<td>11</td>\n<td>CLAIRE Copilot For Data Integration</td>\n<td>자연어 prompt로 mapping 생성, configured transformation 생성,\nAggregator·Expression 식 생성, mapping 요약</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>maxDTMProcesses는 라이선스 범위를 넘기면 안 된다. 예: Secure Agent\n3대 × 에이전트당 CPU 4개 라이선스면 12를 넘기지 않는다. [Secure agent\nbest practices and tuning guidelines]</li>\n<li>DTM JVM의 -Xmx 기본값 64MB는 대용량·다중 partition 매핑에서 Java\nHeap Space 부족을 낸다. 권장값은 2024MB다. S3 Download Part\nSize(5MB)·Multipart Download Threshold(10MB)가 작으면 \"Unable to\ndownload the files from S3\" 오류가 나므로 512MB 정도로 올린다. [Secure\nagent best practices and tuning guidelines]</li>\n<li>Postman처럼 HTTP 버전을 자동으로 붙이는 도구에서는 URL에 HTTP 버전을\n또 쓰지 않는다. 두 번 들어가면 요청이 실패한다. [REST API\nReference]</li>\n<li>클러스터 상태가 Unknown이면 먼저 Secure Agent가 실행 중인지\n확인한다. 그래도 안 되면 관리자가 list-clusters로 상태를 보고\npartial·in-use면 delete-clusters를 실행한다. [Advanced Clusters]</li>\n<li>Data Validation은 sub-organization에서 쓸 수 없고, 브라우저는\nChrome·Edge를 지원하며 성능 때문에 Chrome을 권장한다. Running Jobs\n페이지는 완료 후 5분까지만 job을 보여 준다. [Introducing Data\nValidation] [Monitor]</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P5 PowerCenter (On-Prem) 핵심: 온프렘을 쓴다면 PowerCenter\n도메인·리포지토리·Designer·Workflow Manager로 넘어가고, 아니면 P8로\n간다.</li>\n</ul>\n"}, {"id": "P5", "title": "PowerCenter (On-Prem) 핵심", "level": "입문", "track": "On-Prem", "goal": "PowerCenter 도메인·리포지토리·Designer·Workflow Manager로 온프렘 ETL을 구축·운영한다.", "steps": [{"d": "data-integration__powercenter", "f": "PC_.*_GettingStarted$", "why": "실습: PowerCenter 튜토리얼(레슨형)", "doc": 82}, {"d": "data-integration__powercenter", "f": "0558-informatica-architecture", "why": "아키텍처: 노드와 도메인", "doc": 104}, {"d": "data-integration__powercenter", "f": "InstallationForPowerCenterAndDataQuality", "why": "설치", "doc": 75}, {"d": "common-content-for-data-integration", "f": "_AdministratorGuide$", "why": "도메인·서비스 관리", "doc": 59}, {"d": "data-integration__powercenter", "f": "PC_.*_DesignerGuide$", "why": "소스/타깃/매핑 설계", "doc": 81}, {"d": "data-integration__powercenter", "f": "PC_.*_TransformationGuide$", "why": "변환 레퍼런스(핵심)", "doc": 86}, {"d": "data-integration__powercenter", "f": "PC_.*_TransformationLanguageReference$", "why": "표현식 언어", "doc": 87}, {"d": "data-integration__powercenter", "f": "WorkflowBasicsGuide", "why": "세션·워크플로", "doc": 89}, {"d": "data-integration__powercenter", "f": "AdvancedWorkflowGuide", "why": "고급 워크플로·파티셔닝", "doc": 80}, {"d": "data-integration__powercenter", "f": "RepositoryGuide", "why": "리포지토리·배포", "doc": 85}, {"d": "data-integration__powercenter", "f": "0849-team-based-development", "why": "팀 개발·버전 관리", "doc": 112}, {"d": "data-integration__powercenter", "f": "PC_.*_PerformanceTuningGuide$", "why": "성능 튜닝", "doc": 84}, {"d": "data-integration__powercenter", "f": "0534-how-to-use-full-pushdown", "why": "실습: Pushdown 최적화", "doc": 103}, {"d": "common-content-for-data-integration", "f": "CommandReference", "why": "pmcmd·infacmd", "doc": 61}, {"d": "common-content-for-data-integration", "f": "_SecurityGuide$", "why": "보안", "doc": 66}], "summary": "<h1 id=\"p5-powercenter-on-prem-핵심\">P5. PowerCenter (On-Prem) 핵심</h1>\n<blockquote>\n<p>Informatica domain과 PowerCenter 리포지토리를 세우고, Designer로\n매핑을 만들어 Workflow Manager·Workflow Monitor로 세션을 실행·감시하며,\n튜닝·배포·보안까지 온프렘 ETL 운영 전반을 다루는 단계다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>domain, node(gateway·worker·master gateway), Service Manager,\nRepository Service, Integration Service의 구조와 역할</li>\n<li>서비스 설치 후 domain 구성, application service 생성, 클라이언트\n설치까지의 설치 순서</li>\n<li>Designer의 Source Analyzer·Mapping Designer로 source/target 정의와\n매핑을 만들고, Transformation Language로 식을 쓰는 방법</li>\n<li>Workflow Manager로 Session·Workflow를 만들고 partitioning, pushdown\noptimization, recovery, parameter file로 운영하는 방법</li>\n<li>Repository Manager의 versioning, label, deployment group으로 팀\n개발·배포를 하고 pmcmd·infacmd로 명령행 운영을 하는 방법</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Informatica domain</td>\n<td>PowerCenter 관리의 기본 단위. 하나 이상의 node와 domain\nconfiguration repository(관계형 DB)로 이뤄진다.</td>\n</tr>\n<tr>\n<td>Node</td>\n<td>서버에 설치한 Informatica의 논리적 표현. gateway node는 domain DB를\n갱신할 수 있고 worker node는 application service만 돌린다. master\ngateway node는 한 번에 하나다.</td>\n</tr>\n<tr>\n<td>Service Manager</td>\n<td>모든 node에서 처음 뜨는 Java 프로세스. master gateway node에서는\nLog, User Management, Licensing 같은 Master Core Services를 함께\n돌린다.</td>\n</tr>\n<tr>\n<td>PowerCenter Repository Service</td>\n<td>소스·타깃·매핑·세션 같은 메타데이터를 담은 PowerCenter repository를\n관리한다. repository에는 실제 데이터가 아니라 정의만 저장된다.</td>\n</tr>\n<tr>\n<td>PowerCenter Integration Service</td>\n<td>workflow를 실행해 source에서 데이터를 읽고 변환한 뒤 target에 쓴다.\nLoad Balancer가 Session·Command 등 task를 node에 분배한다.</td>\n</tr>\n<tr>\n<td>Mapping / Mapplet</td>\n<td>source → transformation → target 데이터 흐름. 모든 매핑에는 Source\nQualifier가 들어간다. mapplet은 transformation 묶음을 재사용하는\n객체다.</td>\n</tr>\n<tr>\n<td>Transformation</td>\n<td>데이터를 생성·변경하는 매핑 구성 요소. Filter처럼 행 수를 바꾸는\nactive, HTTP처럼 바꾸지 않는 passive로 나뉜다.</td>\n</tr>\n<tr>\n<td>Session / Workflow</td>\n<td>session은 Integration Service가 언제·어떻게 source에서 target으로\n데이터를 옮길지 정한 task다. workflow는 session, email 알림 같은 task를\n어떻게 실행할지 정한 지시 묶음이다.</td>\n</tr>\n<tr>\n<td>Parameter file</td>\n<td>세션 실행마다 바뀌는 값(DB connection, source/target 파일, mapping\nparameter)을 외부에서 넘기는 파일</td>\n</tr>\n<tr>\n<td>Deployment group</td>\n<td>팀 개발에서 배포할 객체를 묶는 global object. Repository Manager의\nCopy Wizard로 다른 repository에 복사한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<p>각 lesson은 이전 lesson 결과를 이어서 쓰므로 lesson 하나는 한 번에\n끝낸다.</p>\n<ol type=\"1\">\n<li>Administrator tool에서 user와 group을 만들고 group에 privilege를\n준다. repository에 tutorial folder를 만들고 예제 source table을\n생성한다. [Getting Started · Lesson 1]</li>\n<li>Designer &gt; Tools &gt; Source Analyzer에서 Sources &gt; Import\nfrom Database로 ODBC data source를 골라 source definition을 가져온다.\ntarget definition을 만들고 SQL을 생성·실행해 target table을 만든다.\n[Getting Started · Lesson 2]</li>\n<li>Mapping Designer에서 모든 source 행을 target에 넣는 pass-through\nmapping을 만든다. Workflow Manager에서 Session과 Workflow를 만들고\n실행한 뒤 Workflow Monitor로 확인한다. [Getting Started · Lesson 3]</li>\n<li>Expression, Aggregator, Lookup을 넣어 집계 값을 계산하는 매핑을\n만들고 session·workflow로 실행한다. [Getting Started · Lesson 4]</li>\n<li>Stored Procedure, Filter, Sequence Generator로 fact table과\ndimension table을 채우는 매핑을 만든다. [Getting Started · Lesson\n5]</li>\n<li>XML schema를 source로 쓰고, 급여 3종을 BASESALARY·COMMISSION·BONUS\n컬럼으로 pivot한 뒤 Expression으로 합계를 내고 Router로 부서별 XML\ntarget에 나눠 쓴다. [Getting Started · Lesson 6]</li>\n<li>(확장) session 속성 Properties 탭에서 pushdown을 Full로 바꾸고\nMapping 탭의 View Pushdown Optimization으로 생성 SQL과 pushdown group을\n확인한다. [How to use full pushdown optimization in powercenter]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Getting Started</td>\n<td>제품 구성 요소 개요와 6개 lesson(pass-through → 집계 →\nfact/dimension → XML)으로 데이터 웨어하우스를 만든다</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Informatica architecture nodes and domains</td>\n<td>node는 domain DB에 JDBC로 붙는다. nodemeta.xml은\nINFA_HOME/isp/config, domains.infa는 INFA_HOME에 있다</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Installation For PowerCenter And Data Quality</td>\n<td>설치 전 준비 → console·graphical·silent 설치 → domain 구성 완료 →\napplication service 생성 → 클라이언트 설치</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Administrator Guide</td>\n<td>Administrator tool의 Manage·Monitor·Logs·Reports·Security 탭, node,\nHigh Availability(resilience, restart·failover, recovery), license</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Designer Guide</td>\n<td>source·flat file·target 정의, mapping·mapplet, mapping\nparameter/variable, Debugger, Type 1·Type 2 Dimension 매핑을 만드는\nMapping Wizard</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Transformation Guide</td>\n<td>Aggregator, Joiner, Lookup(cache·dynamic cache), Router, Update\nStrategy, SQL, Java 등 transformation별 레퍼런스</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Transformation Language Reference</td>\n<td>연산자에 null이 섞이면 결과가 NULL이 된다(|| 제외). null 판정은\nISNULL로 한다</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Workflow Basics Guide</td>\n<td>workflow는 실행 전에 validate해야 하며, 이때 nested worklet을 포함한\n모든 task instance가 검증된다</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Advanced Workflow Guide</td>\n<td>pipeline partitioning(partition type 6종), pushdown optimization,\ncommit point, workflow recovery, grid, parameter file</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Repository Guide</td>\n<td>folder·permission, shortcut, versioned object check out/in, label,\nobject query, deployment group 복사, XML export/import</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Team based development in the powercenter repository and th</td>\n<td>PowerCenter repository는 versioning이 내장돼 있다. Model\nrepository는 Perforce·Subversion 같은 외부 버전 관리와 연동한다</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Performance Tuning Guide</td>\n<td>병목을 하나 찾아 없애고 다음 병목으로 넘어간다. 단일 partition\n튜닝을 끝낸 뒤 pipeline partition을 추가한다</td>\n</tr>\n<tr>\n<td>13</td>\n<td>How to use full pushdown optimization in powercenter</td>\n<td>full pushdown은 source와 target이 같은 DB에 있을 때(예: Teradata →\nTeradata) 알맞다</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Command Reference</td>\n<td>infacmd(domain·service 관리), infasetup(node·domain 정의),\npmcmd(workflow 시작·중지·스케줄·모니터링), pmrep 명령 레퍼런스</td>\n</tr>\n<tr>\n<td>15</td>\n<td>Security Guide</td>\n<td>Native·LDAP·Kerberos·SAML 인증, domain 보안 통신,\nprivilege·role·permission 관리, audit report</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>nodemeta.xml이나 domains.infa를 손으로 고치면 node 간 연결이 바뀔 수\n있다. 변경은 infasetup updategatewaynode / updateworkernode로 한다.\n[Informatica architecture nodes and domains]</li>\n<li>gateway node가 여럿이면 master gateway가 죽어도 다른 gateway node 중\n하나가 새 master로 선출된다. worker node는 master가 될 수 없으므로 HA를\n원하면 gateway node를 2개 이상 둔다. [Informatica architecture nodes and\ndomains]</li>\n<li>full pushdown에서는 DB가 오류를 처리하므로 reject file이 남지 않고,\n오류가 나면 트랜잭션 전체가 rollback된다. 대소문자, 숫자·날짜의 Char\n변환, sort 시 null 순서, precision 차이로 Integration Service 실행\n결과와 다를 수 있다. [How to use full pushdown optimization in\npowercenter]</li>\n<li>PowerCenter repository는 checkout을 passive 방식으로 보호한다. 다른\n사용자는 check in 시점에야 충돌을 안다. undo checkout을 하면 변경분이\n사라지고, 이전 버전은 보기·비교만 되고 복원은 안 된다. [Team based\ndevelopment in the powercenter repository and th]</li>\n<li>설치 시 기본 administrator 계정이 만들어진다. 설치 후 처음\n로그인하면 이 계정의 비밀번호부터 바꾼다. [Security Guide]</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P6 PowerExchange &amp; CDC: 메인프레임·레거시 소스를 PowerExchange로\n읽고 변경분(CDC)을 PowerCenter로 넘긴다.</li>\n</ul>\n"}, {"id": "P6", "title": "PowerExchange & CDC (On-Prem)", "level": "심화", "track": "On-Prem", "goal": "메인프레임·DB 로그 기반 CDC와 PowerExchange 어댑터로 레거시 소스를 연동한다.", "steps": [{"d": "powerexchange-for-cdc-and-mainframe", "f": "InstallationAndUpgradeGuide", "why": "설치", "doc": 289}, {"d": "powerexchange-for-cdc-and-mainframe", "f": "NavigatorUserGuide", "why": "Navigator·Data Map", "doc": 293}, {"d": "powerexchange-for-cdc-and-mainframe", "f": "BulkDataMovementGuide", "why": "대량 이동", "doc": 287}, {"d": "powerexchange-for-cdc-and-mainframe", "f": "\\(CDC\\)GuideForLinux", "why": "LUW CDC", "doc": 286}, {"d": "powerexchange-for-cdc-and-mainframe", "f": "\\(CDC\\)GuideFor\\(zOS\\)", "why": "z/OS CDC", "doc": 285}, {"d": "powerexchange-for-cdc-and-mainframe", "f": "PowerExchangeInterfacesForPowerCenter", "why": "PowerCenter 연동", "doc": 294}, {"d": "powerexchange-adapters-for-powercenter", "f": "SAP\\)NetWeaverUserGuideForPowerCenter", "why": "SAP 어댑터", "doc": 237}], "summary": "<h1 id=\"p6-powerexchange--cdc-on-prem\">P6. PowerExchange &amp; CDC\n(On-Prem)</h1>\n<blockquote>\n<p>메인프레임·레거시 DB를 Data Map으로 관계형처럼 읽고, 로그 기반 CDC로\n변경분만 PowerCenter에 흘려보내는 단계다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>IBM i, Linux/UNIX, Windows, z/OS에 PowerExchange를\nfull·upgrade·hotfix 방식으로 설치하는 절차</li>\n<li>PowerExchange Navigator로 Data Map, Capture Registration, Extraction\nMap을 만들고 Database Row Test로 검증하는 방법</li>\n<li>PowerExchange Listener 기반 Bulk Data Movement로 타깃을 초기\n적재(materialize)하는 방법</li>\n<li>LUW·z/OS 소스별 CDC 구성(Logger, Agent, Condense)과 변경 데이터\n추출</li>\n<li>PWXPC와 PowerExchange for SAP NetWeaver로 PowerCenter 매핑·세션에\n연결하는 방법</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PowerExchange Listener</td>\n<td>Data Map을 저장·관리하고 bulk 데이터를 PowerCenter와 Navigator에\n제공한다. 소스가 원격 시스템(z/OS 등)에 있으면 그 시스템에 별도\nListener가 필요하다.</td>\n</tr>\n<tr>\n<td>PowerExchange Navigator</td>\n<td>Windows용 GUI. Data Map, 등록, 추출 맵 같은 PowerExchange 객체를\n정의하고 관리한다.</td>\n</tr>\n<tr>\n<td>Data Map</td>\n<td>Adabas, IMS, IDMS, VSAM, SEQ 같은 비관계형 소스를 관계형 행 뷰로\n보여 주는 정의. SQL 형태로 읽고 쓰려면 반드시 있어야 한다.</td>\n</tr>\n<tr>\n<td>Copybook</td>\n<td>레코드·세그먼트·필드·키 정의를 통칭한다. COBOL, PL/I copybook이나\nIMS DBD, Adabas FDT를 Data Map으로 가져온다.</td>\n</tr>\n<tr>\n<td>Registration Group / Capture Registration</td>\n<td>CDC 대상 데이터셋·테이블을 등록하는 객체. 등록이 없으면 변경 캡처가\n안 된다.</td>\n</tr>\n<tr>\n<td>Extraction Group / Extraction Map</td>\n<td>캡처된 변경 데이터를 추출하는 정의. Change Indicator, Before Image\n컬럼을 추가하거나 뺄 수 있다.</td>\n</tr>\n<tr>\n<td>PowerExchange Logger</td>\n<td>LUW와 z/OS 각각에 있는 CDC 컴포넌트. z/OS 쪽은 PowerExchange Agent,\nPowerExchange Condense와 함께 구성한다.</td>\n</tr>\n<tr>\n<td>Database Row Test</td>\n<td>리소스의 데이터를 미리 보고, Listener LISTTASK/STOPTASK 명령을\n내리고, CDC용 restart token을 생성한다.</td>\n</tr>\n<tr>\n<td>DBMOVER</td>\n<td>Listener 동작을 정하는 구성 파일. TCP/IP 포트, 로그 파일, 튜닝\n구문을 여기서 설정한다.</td>\n</tr>\n<tr>\n<td>PWXPC</td>\n<td>PowerExchange Client for PowerCenter. PowerCenter\n매핑·connection·세션에서 PowerExchange 소스를 쓰게 하고\nrestart/recovery를 제공한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<p>이 단계에는 lab 문서가 없다. 아래는 문서에 나온 기능만으로 구성한\n권장 실습 순서다.</p>\n<ol type=\"1\">\n<li>OS·소스·타깃 버전 요건과 License Key를 확인하고 Windows에 full\ninstallation을 수행한다. 64-bit 머신에서는 Navigator 설치 옵션을 고른다.\n[Installation And Upgrade Guide]</li>\n<li>DBMOVER 파일을 수정하고 TCP/IP 포트를 지정한 뒤 PowerExchange\nListener를 기동한다. [Bulk Data Movement Guide]</li>\n<li>Navigator에서 PowerExchange가 제공하는 예제 Data Map·copybook·데이터\n파일로 single-record Data Map을 만들고 COBOL copybook을 가져온다.\n[Navigator User Guide]</li>\n<li>Database Row Test로 Data Map이 실제 데이터를 읽는지 확인한다.\n[Navigator User Guide]</li>\n<li>Oracle이나 Db2 LUW 같은 관계형 소스는 Data Map 없이 PowerCenter\nDesigner에서 메타데이터를 가져와 bulk 세션을 만든다. [Bulk Data Movement\nGuide]</li>\n<li>CDC 소스에 Registration Group과 Capture Registration을 추가하고,\nExtraction Map을 확인한 뒤 Database Row Test로 restart token을 생성한다.\n[Navigator User Guide]</li>\n<li>PWXPC connection을 만들고 CDC 세션을 구성해 Workflow Monitor에서\n진행 상황을 본다. [PowerExchange Interfaces For PowerCenter], [Bulk Data\nMovement Guide]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Installation And Upgrade Guide</td>\n<td>z/OS는 z/OS Installation Assistant를 실행한 뒤 생성된 job을 직접\nsubmit해야 설치가 끝난다.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Navigator User Guide</td>\n<td>Data Map 작성, copybook import, Capture Registration, Extraction\nMap, Database Row Test까지 Navigator 작업 전부를 다룬다.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Bulk Data Movement Guide</td>\n<td>소스별(Adabas, Datacom, Db2, IDMS, IMS, SQL Server, Oracle, SEQ,\nVSAM) 설정과 fault tolerance, connection pooling, pipeline partition\n튜닝을 설명한다.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>CDC Guide For Linux UNIX And Windows</td>\n<td>Logger for LUW와 Db2, SQL Server, MySQL, Express CDC for Oracle,\nPostgreSQL, SAP HANA CDC를 소스별로 정리한다.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>CDC Guide For z/OS</td>\n<td>Agent, Logger for z/OS, Condense 구성과 Adabas, VSAM, Datacom, Db2\nfor z/OS, IDMS, IMS CDC, zIIP 활용을 다룬다.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>PowerExchange Interfaces For PowerCenter</td>\n<td>PWXPC(mapping, connection, session, restart and recovery, Flexible\nTarget Key Transformation)와 PowerExchange ODBC 두 인터페이스를 비교해\n본다.</td>\n</tr>\n<tr>\n<td>7</td>\n<td>PowerExchange For SAP NetWeaver User Guide For PowerCenter</td>\n<td>Dynamic ABAP Table Extractor, ABAP mapping, ALE 기반 IDoc, BAPI/RFC,\nBW Open Hub 추출, SAP BI 적재 방식을 구분한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>업그레이드는 소스·타깃 시스템, Navigator용 Windows, PowerCenter\nClient(또는 Developer), Integration Service(또는 Data Integration\nService) 시스템 모두에 해야 한다. PowerCenter 업그레이드와 일정을\n맞춘다.</li>\n<li>Datacom과 IDMS는 bulk 읽기만 된다. 타깃으로 쓸 수 없다.</li>\n<li>쓰기 모드를 고를 때 따져 볼 점이 있다. Synchronous는 무결성과 복구를\n지키지만 느리다. Asynchronous는 빠르지만 복구가 안 된다. Asynchronous\nwith Fault Tolerance는 오류를 reject file과 로그로 남긴다.</li>\n<li>문서마다 PowerExchange와 PowerCenter 간 환경 변수 비호환 항목이\n있다. 같은 머신에 둘을 함께 설치할 때 먼저 읽는다.</li>\n<li>Bulk로 타깃을 materialize한 뒤 CDC로 변경분만 반영하면 타깃 갱신이\n빨라진다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P7 PowerCenter → Cloud 현대화: PowerCenter 자산을 CDI-PC/CDI로\n옮기는 방법을 익힌다.</li>\n</ul>\n"}, {"id": "P7", "title": "PowerCenter → Cloud 현대화", "level": "심화", "track": "Hybrid", "goal": "기존 PowerCenter 자산을 CDI-PC(PowerCenter Cloud Edition)/CDI로 이관하는 방법을 익힌다.", "steps": [{"d": "cloud-data-integration-for-powercenter", "f": "GettingStartedWithCloudDataIntegrationForPowerCenter", "why": "실습: CDI-PC 시작하기", "doc": 334}, {"d": "cloud-data-integration-for-powercenter", "f": "PowerCenterModernization", "why": "현대화 전략·도구", "doc": 348}, {"d": "cloud-data-integration-for-powercenter", "f": "DomainRegistration", "why": "도메인 등록", "doc": 332}, {"d": "cloud-data-integration-for-powercenter", "f": "CDIPC_.*_DesignerGuide$", "why": "CDI-PC Designer", "doc": 331}, {"d": "cloud-data-integration-for-powercenter", "f": "CDIPC_.*_WorkflowBasicsGuide$", "why": "CDI-PC Workflow", "doc": 341}, {"d": "data-integration__powercenter", "f": "_1650_1051UpgradePaths", "why": "업그레이드 경로", "doc": 163}], "summary": "<h1 id=\"p7-powercenter--cloud-현대화\">P7. PowerCenter → Cloud\n현대화</h1>\n<blockquote>\n<p>온프레미스 PowerCenter 도메인을 IDMC에 등록해 CDI-PC로 운영하고, 기존\n자산을 평가·변환해 Cloud Data Integration으로 옮기는 단계다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>CDI-PC 구조: 데이터와 세션·워크플로 실행은 온프레미스 도메인에 두고\n관리는 IDMC에서 한다</li>\n<li>CDI-PC 도메인을 IDMC에 등록·수정·해제·삭제하는 절차</li>\n<li>Repository Assessment → Asset Conversion → Bulk Metadata Update로\n이어지는 현대화 흐름</li>\n<li>CDI-PC Designer와 Workflow Manager로 mapping, session, workflow를\n다루는 방법</li>\n<li>10.5.1 기준 제품별 업그레이드 경로</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CDI-PC</td>\n<td>Cloud Data Integration for PowerCenter. IDMC의 domain management\nservice와 연결된 온프레미스 도메인을 만든다. 기존 Informatica domain을\nCDI-PC로 마이그레이션할 수도 있다.</td>\n</tr>\n<tr>\n<td>Domain registration</td>\n<td>온프레미스 도메인과 IDMC 사이 통신을 여는 작업. 등록해야 CDI-PC에서\njob을 만들고 돌리고 모니터링할 수 있다.</td>\n</tr>\n<tr>\n<td>Secure Agent group</td>\n<td>도메인 등록 시 지정한다. 그룹 안의 Secure Agent가 도메인에 접근할 수\n있어야 한다.</td>\n</tr>\n<tr>\n<td>Repository Assessment</td>\n<td>PowerCenter나 Model repository를 백업해 IDMC에 복원한 뒤 변환\n가능성을 평가한다. 결과는 Automated, Partial 같은 범주로 나뉜다.</td>\n</tr>\n<tr>\n<td>Asset Conversion</td>\n<td>mapping, mapplet, session, workflow를 각각 CDI의 mapping, mapplet,\nmapping task, taskflow로 바꾼다.</td>\n</tr>\n<tr>\n<td>Repoint Configuration / Connection Map</td>\n<td>앞의 것은 assessment에서 다른 endpoint로 repoint할 수 있는지\n평가하고, 뒤의 것은 conversion에서 PowerCenter connection을 IDMC\nconnection에 대응시킨다.</td>\n</tr>\n<tr>\n<td>Bulk Metadata Update</td>\n<td>변환된 mapping·taskflow의 필드, advanced property, connection 정보를\n한 번에 고친다. assessment ZIP에 든 BulkUpdateConnectionTemplate.xlsx를\n쓴다.</td>\n</tr>\n<tr>\n<td>My Jobs</td>\n<td>assessment, conversion, parameter file conversion, bulk update job을\n추적하고 리포트·로그를 내려받는 페이지.</td>\n</tr>\n<tr>\n<td>Mapplet</td>\n<td>여러 mapping에서 재사용하는 transformation 묶음. mapplet을 고치면\n모든 인스턴스에 반영된다.</td>\n</tr>\n<tr>\n<td>Session Configuration Object</td>\n<td>commit·load, 로그, 오류 처리 설정을 담는다. 폴더마다 기본 객체가\n있고, 수정하면 이를 쓰는 세션이 모두 따라 바뀐다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>조직·라이선스 정보와 CDI-PC 서비스 역할·권한을 확인한다. [Getting\nStarted With Cloud Data Integration For PowerCenter]</li>\n<li>IDMC에 로그인해 CDI-PC Home page로 들어가고 설치 파일을 내려받는다.\n[Getting Started With Cloud Data Integration For PowerCenter]</li>\n<li>Home page의 Register a Domain에서 Add New Domain을 누르고 Domain\nName, Domain Display Name, Gateway Host, Gateway Node Port(HTTPS)를\n입력한다. [Domain Registration]</li>\n<li>Secure Agent group과 인증 방식(Kerberos 또는 non-Kerberos)을\n지정하고 Validate를 거쳐 Register를 누른다. [Domain Registration]</li>\n<li>Explore page와 Domain Details page에서 도메인 상태를 보고, Alerts\nand notifications, Asset logs, Metering information을 확인한다. [Getting\nStarted With Cloud Data Integration For PowerCenter], [Domain\nRegistration]</li>\n<li>Repoint configuration을 만들고 assessment task를 돌려 결과 파일을\n받는다. [PowerCenter Modernization]</li>\n<li>Connection map과 conversion properties 구성을 만든 뒤 conversion\ntask를 실행하고, My Jobs에서 결과를 검증하고 bulk update task로\n마무리한다. [PowerCenter Modernization]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Getting Started With Cloud Data Integration For PowerCenter</td>\n<td>데이터 저장과 세션·워크플로 실행은 온프레미스 도메인에 남고, 도메인\n관리는 IDMC가 맡는다.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>PowerCenter Modernization</td>\n<td>PowerCenter뿐 아니라 Data Engineering Integration, Data Quality\n자산도 대상이다. DQ 자산(application, scorecard, profile 등)은 변환\n가능성 평가까지 지원한다.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Domain Registration</td>\n<td>등록된 도메인 백업을 restoreDomain으로 복원했다면\n<code>-cdr true</code>를 붙여야 등록 시 validation error를 피한다.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Designer Guide</td>\n<td>Source Analyzer, Target Designer, Mapping·Mapplet, 파라미터·변수,\nuser-defined function, Debugger, SCD Type 1/2/3 Mapping Wizard를\n다룬다.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Workflow Basics Guide</td>\n<td>Workflow는 Start task로 시작하고, session·task를 link로 잇는다. 실행\n전 validation이 필수이고 기본 실행 방식은 on demand다.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>1051 Upgrade Paths</td>\n<td>도메인에 10.5.1 installer 대상 제품이 여럿 있으면 모두 같은 버전으로\n올린 뒤 hotfix를 적용한다. 10.5에서는 10.5.1 hotfix를 적용한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>등록이 Registering 상태에서 멈추면 최소 15분 기다린 뒤 Refresh를\n누른다. Offline으로 보이면 reconcile을 진행한다.</li>\n<li>Kerberos 도메인은 Administrator tool과 도메인의 TLS 인증서를\n브라우저에 먼저 넣어야 한다. OS 사용자와 도메인 관리자 계정이 같아야\n한다.</li>\n<li>non-Kerberos로 등록한 도메인을 Kerberos로 바꾸면 수정으로는 안 되고\n다시 등록해야 한다. 도메인 수정은 August 2023 이후 버전에서만 된다.</li>\n<li>도메인을 deregister하면 실행 중인 job이 멈출 수 있다. 다른 조직이나\npod로 옮기려면 먼저 deregister한다.</li>\n<li>Conversion 전에 assessment를 끝내고 필요한 asset 권한을 부여한다.\nPartial로 분류된 자산은 변환 후 수동 손질이 필요할 수 있다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P8 Data Quality &amp; Profiling: 프로파일링으로 데이터를 진단하고\n규칙·사전·예외 관리로 품질을 높인다.</li>\n</ul>\n"}, {"id": "P8", "title": "Data Quality & Profiling", "level": "중급", "track": "Cloud + On-Prem", "goal": "프로파일링으로 데이터를 진단하고 규칙·사전·예외 관리로 품질을 개선한다.", "steps": [{"d": "data-governance-and-quality-cloud__data-profiling", "f": "CDP_.*_GettingStarted$", "why": "실습: Cloud 프로파일링 시작", "doc": 1382}, {"d": "data-governance-and-quality-cloud__data-profiling", "f": "CDP_.*_DataProfiling$", "why": "프로파일링 상세", "doc": 1381}, {"d": "data-governance-and-quality-cloud__data-quality", "f": "CDQ_.*_Introduction$", "why": "Cloud DQ 개요", "doc": 1390}, {"d": "data-governance-and-quality-cloud__data-quality", "f": "CDQ_.*_DataQualityAssets$", "why": "규칙·클렌즈·매치 자산", "doc": 1388}, {"d": "data-governance-and-quality-cloud__data-quality", "f": "DataQualityDictionaries", "why": "사전", "doc": 1389}, {"d": "data-governance-and-quality-cloud__data-quality", "f": "ExceptionManagement", "why": "예외 관리", "doc": 1395}, {"d": "informatica-data-quality", "f": "DataQualityGettingStartedGuide", "why": "실습: IDQ 튜토리얼(레슨형)", "doc": 1555}, {"d": "informatica-data-quality", "f": "ProfilingGettingStartedGuide", "why": "실습: IDQ 프로파일링", "doc": 1566}, {"d": "informatica-data-quality", "f": "_DeveloperToolGuide$", "why": "Developer Tool", "doc": 1574}, {"d": "informatica-data-quality", "f": "_AnalystToolGuide$", "why": "Analyst Tool", "doc": 1558}, {"d": "informatica-data-quality", "f": "RuleSpecificationGuide", "why": "규칙 명세", "doc": 1557}], "summary": "<h1 id=\"p8-data-quality--profiling\">P8. Data Quality &amp;\nProfiling</h1>\n<blockquote>\n<p>프로파일링으로 데이터 상태를 진단하고, Rule\nSpecification·Dictionary·Exception 관리로 품질 문제를 찾아 고치는\n단계다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>IDMC Data Profiling에서 runtime environment, connection, project를\n준비하고 profile을 실행·비교하는 방법</li>\n<li>Cloud Data Quality 자산(Cleanse, Deduplicate, Labeler, Parse, Rule\nspecification, Verifier)과 Dictionary의 쓰임</li>\n<li>Rule specification으로 exception record를 표시하고 exception task로\n처리하는 흐름</li>\n<li>온프레미스 IDQ에서 Analyst tool과 Developer tool을 나눠 쓰는\n방법</li>\n<li>Rule Specification을 mapplet으로 생성해 Developer 쪽 mapping에\n연결하는 방법</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Profile</td>\n<td>data profiling task라고도 한다. 소스 객체 컬럼의 value frequency,\npattern, data type, null·distinct 값을 뽑는다. filter, rule, schedule을\n붙일 수 있다.</td>\n</tr>\n<tr>\n<td>Secure Agent / Runtime environment</td>\n<td>작업을 실행하는 플랫폼. 조직마다 runtime environment가 최소 하나\n있어야 task를 돌릴 수 있다.</td>\n</tr>\n<tr>\n<td>Scorecard</td>\n<td>Cloud profile에서는 rule occurrence와 함께 다룬다. 온프레미스\nAnalyst 튜토리얼 Lesson 6에서 직접 만들고 실행한다.</td>\n</tr>\n<tr>\n<td>Rule Specification</td>\n<td>비즈니스 규칙의 데이터 요건을 논리 형태로 표현한 자산. input, rule\nset, rule statement로 구성된다.</td>\n</tr>\n<tr>\n<td>Rule Statement</td>\n<td>input, operator, condition, action으로 이뤄진다. condition은 분석\n종류를, action은 조건 충족 시 출력을 정한다.</td>\n</tr>\n<tr>\n<td>Dictionary</td>\n<td>mapping에서 데이터를 대조하는 reference data set. 표준값을 담은\n컬럼(valid column)이 최소 하나 있어야 한다.</td>\n</tr>\n<tr>\n<td>Cleanse / Parse / Verifier</td>\n<td>값을 표준화하는 자산, 패턴 기반·사용자 정의로 값을 쪼개는 자산,\n주소를 검증하는 자산.</td>\n</tr>\n<tr>\n<td>Deduplicate</td>\n<td>중복 레코드를 찾는 자산. field type과 identity objective를\n설정한다.</td>\n</tr>\n<tr>\n<td>Exception task</td>\n<td>rule specification이 exception indicator를 붙인 레코드, 즉 미해결\n품질 문제가 남은 레코드를 처리한다.</td>\n</tr>\n<tr>\n<td>Model Repository</td>\n<td>Developer·Analyst tool의 프로젝트·폴더 메타데이터를 담는 관계형 DB.\n편집 중인 asset은 잠긴다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>호환 브라우저(Chrome 62 이상, Firefox 64-bit 56 이상, IE11은 CORS\n활성화 필요)를 확인한다. [Getting Started (Data Profiling)]</li>\n<li>Windows나 Linux에 Secure Agent를 설치하고 Secure Agent group으로\nruntime environment를 만든다. [Getting Started (Data Profiling)]</li>\n<li>Administrator의 Connections 페이지에서 소스 connection을 만든다.\n[Getting Started (Data Profiling)]</li>\n<li>Explore page에서 project와 folder를 만들고 profile을 생성해\n실행한다. 결과 탭에서 run 비교, 결과 export, value frequency의\ndictionary export를 해 본다. [Getting Started (Data Profiling)], [Data\nProfiling]</li>\n<li>온프레미스 Analyst tool로 Lesson 1~8을 따라간다. data object 생성,\ndefault·custom profile, expression rule, scorecard, profile 컬럼 기반\nreference table 생성까지 한다. [Data Quality Getting Started Guide],\n[Profiling Getting Started Guide]</li>\n<li>Developer tool로 physical data object를 가져와 profile을 돌리고,\nparsing → standardizing → address validation 순서로 데이터를 정제한다.\n[Data Quality Getting Started Guide]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Getting Started (Data Profiling)</td>\n<td>system requirements → runtime environment → connection → project\nsetup 순서로 프로파일링 프로젝트를 준비한다.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Data Profiling</td>\n<td>profile에 Verifier·Cleanse 자산을 rule로 붙여 주소·이메일의 완전성과\n유효성을 점검하는 예가 나온다.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Introduction (Data Quality)</td>\n<td>Data Quality는 Data Profiling, Data Integration, Administrator,\nMonitor, Data Observability와 함께 IDMC 서비스로 쓴다.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Data Quality Assets</td>\n<td>Cleanse, Deduplicate, Labeler, Parse, Rule specification, Verifier\n여섯 자산의 구성과 테스트 방법을 파트별로 설명한다.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Data Quality Dictionaries</td>\n<td>dictionary는 DQ 자산에 넣고, 그 자산을 Data Integration mapping의\ntransformation에 추가해야 동작한다.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Exception Management</td>\n<td>소스 식별 → rule specification(basic/advanced) → profiling task →\nexception task 생성·실행 순서로 진행한다.</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Data Quality Getting Started Guide</td>\n<td>Analyst 8개 레슨과 Developer 6개 레슨으로 된 튜토리얼이다.</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Profiling Getting Started Guide</td>\n<td>프로파일링으로 value frequency, data type 같은 내용과 key,\nfunctional dependency 같은 구조를 찾는다.</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Developer Tool Guide</td>\n<td>Model repository, physical·logical data object, application\n배포·patch 배포, REST API·infacmd 기반 CI/CD를 다룬다.</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Analyst Tool Guide</td>\n<td>웹 기반 도구. Library, Connections, Job Status, Projects workspace로\n자산과 ad hoc job을 관리한다.</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Rule Specification Guide</td>\n<td>Analyst의 Design workspace에서 rule specification을 만들고 검증한 뒤\nmapplet을 생성한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>기본값으로 소스가 100,000,000행을 넘으면 컬럼마다 subtask를 하나씩\n만든다. Minimum Number of Rows for Split Process per Column으로\n조정하고, Administrator에서 Secure Agent 동시 실행 수도 함께\n맞춘다.</li>\n<li>Explore page는 # ? ` | { } \" ^ &amp; [ ] / \\ 문자를 지원하지 않는다.\nproject, folder, asset, tag 이름에 쓰지 않는다.</li>\n<li>Profile 이름은 저장 폴더 안에서 고유해야 하고 특수문자를 쓸 수 없다.\n위치를 지정하지 않으면 Default project에 저장된다.</li>\n<li>Rule specification은 mapplet을 만들기 전에 validate하고, 샘플 값으로\ntest해 출력이 규칙 요건에 맞는지 확인한다.</li>\n<li>Developer tool의 domain search는 결과가 2048개를 넘으면 표시되지\n않는다. Analyst tool 검색은 Search Service가 켜져 있어야 한다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P9 Data Governance &amp; Catalog: 품질 결과를 거버넌스·카탈로그\n영역으로 넓혀 자산을 정의하고 찾는다.</li>\n</ul>\n"}, {"id": "P9", "title": "Data Governance & Catalog", "level": "중급", "track": "Cloud + On-Prem", "goal": "메타데이터 스캔·카탈로그·비즈니스 용어·데이터 마켓플레이스로 거버넌스 체계를 구성한다.", "steps": [{"d": "metadata-command-center", "f": "IntroductionAndGettingStarted", "why": "실습: MCC 시작하기(스캔)", "doc": 1500}, {"d": "data-governance-and-catalog", "f": "IntroductionAndGettingStarted", "why": "실습: CDGC 시작하기", "doc": 1351}, {"d": "data-governance-and-catalog", "f": "UnderstandingTechnicalAssets", "why": "기술 자산·리니지", "doc": 1353}, {"d": "data-governance-and-catalog", "f": "UnderstandingBusinessAssets", "why": "용어집·정책", "doc": 1352}, {"d": "data-governance-and-catalog", "f": "AssetDiscovery", "why": "자산 검색", "doc": 1358}, {"d": "data-governance-and-catalog", "f": "DataAccessManagement", "why": "데이터 접근 관리", "doc": 1350}, {"d": "data-governance-and-catalog", "f": "MetadataAccessControlHandbook", "why": "메타데이터 접근 제어", "doc": 1362}, {"d": "data-marketplace", "f": "DMP_.*_IntroductionAndGettingStarted", "why": "실습: 데이터 마켓플레이스", "doc": 1373}, {"d": "enterprise-data-catalog", "f": "EnterpriseDataCatalogUserGuide", "why": "On-Prem EDC", "doc": 1016}, {"d": "axon-data-governance", "f": "DataGovernanceUserGuide", "why": "On-Prem Axon", "doc": 1509}], "summary": "<h1 id=\"p9-data-governance--catalog\">P9. Data Governance &amp;\nCatalog</h1>\n<blockquote>\n<p>Metadata Command Center로 메타데이터를 추출하고, Data Governance and\nCatalog에서 기술·비즈니스 자산을 연결·보호한 뒤, Data Marketplace로\n데이터를 셀프서비스 공급하는 거버넌스 체계를 세운다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>Metadata Command Center(MCC)에서 소스 시스템 메타데이터를\n추출·프로파일링·분류하는 흐름</li>\n<li>Data Governance and Catalog(CDGC)의 기술 자산과 비즈니스\n자산(Glossary, Policy, Process 등)의 차이와 연결 방법</li>\n<li>검색, Relationships, Data lineage, 감사 이력으로 자산을 찾고\n추적하는 방법</li>\n<li>Metadata access control과 Data Access Management로 메타데이터와 실제\n데이터 접근을 따로 통제하는 방법</li>\n<li>Data Marketplace에서 data collection을 게시하고 주문·승인으로\n데이터를 전달하는 구조</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Metadata Command Center</td>\n<td>DB, 데이터 레이크, 웨어하우스 등에서 메타데이터를 추출·저장·보강하는\n서비스. 프로파일링, 분류, 관계 탐색, 접근 정책 관리도 여기서 한다.</td>\n</tr>\n<tr>\n<td>Catalog Source</td>\n<td>메타데이터 추출 설정 단위. 추출 설정, 활성화한 capability,\n프로파일링 필터, 작업 스케줄에 따라 CDGC에 보이는 기술 자산이\n달라진다.</td>\n</tr>\n<tr>\n<td>Technical asset</td>\n<td>소스에서 추출한 데이터 표현. Data element(컬럼·필드), Technical data\nset(테이블), Data container로 나뉜다.</td>\n</tr>\n<tr>\n<td>Business asset</td>\n<td>데이터를 왜, 어디서, 어떻게 쓰는지 설명하는 자산. Glossary Business\nTerm, Metric, Policy, Process, AI Model, Regulation 등이 있다.</td>\n</tr>\n<tr>\n<td>Glossary Domain / Business Term</td>\n<td>비즈니스 용어집 계층. 용어를 기술 자산에 연결(Glossary\nassociation)해 비즈니스 맥락을 붙인다.</td>\n</tr>\n<tr>\n<td>Data lineage</td>\n<td>원천 시스템부터 목적지까지 데이터 흐름을 시각화한 것. 상류 출처와\n하류 영향 범위를 파악한다.</td>\n</tr>\n<tr>\n<td>Access policy / Asset group</td>\n<td>MCC에서 정의하는 메타데이터 접근 규칙. 역할·자산 그룹·attribute\ngroup 단위로 볼 수 있는 자산과 속성을 제한한다.</td>\n</tr>\n<tr>\n<td>Data access policy</td>\n<td>Data Access Management의 실제 데이터 보호 정책. Data access control,\nData filter, Data de-identification 세 가지가 있다.</td>\n</tr>\n<tr>\n<td>Precedence tier</td>\n<td>Data de-identification 정책의 평가 순서를 정하는 그룹. 티어 안에서는\n위에서 아래로, 티어끼리는 낮은 숫자부터 평가한다.</td>\n</tr>\n<tr>\n<td>Data collection</td>\n<td>Data Marketplace에서 Data Owner가 데이터 자산을 묶어 게시하는 단위.\nData User가 검색해 주문한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>IDMC My Services에서 Metadata Command Center 타일을 열어 로그인한다.\n관리자가 서비스 접근 권한을 먼저 부여해야 한다. [Metadata Command Center\nIntroduction And Getting Started]</li>\n<li>MCC Home 대시보드와 Explore를 둘러보고, Import predefined content로\n기본 콘텐츠를 가져온다. 사내 보안 정책상 필요하면 Secure Agent에서\n메타데이터 작업을 실행한다. [Metadata Command Center Introduction And\nGetting Started]</li>\n<li>Manage access to assets 장을 따라 Predefined user roles와 Predefined\naccess policies를 확인하고, 실습 계정에 필요한 Asset privileges와\nFeature privileges를 점검한다. [Metadata Command Center Introduction And\nGetting Started]</li>\n<li>Data Governance and Catalog에 로그인해 Home page에서 추출된 자산을\n확인하고, Import assets로 비즈니스 자산을 가져온다. [Data Governance and\nCatalog Introduction And Getting Started]</li>\n<li>가져온 자산을 검색·탐색하고 lineage와 관계를 열어 본다. Bulk import\n결과는 Job Monitoring에서 상태와 로그를 확인한다. [Data Governance and\nCatalog Introduction And Getting Started]</li>\n<li>Data Marketplace에 접속해 Predefined roles를 배정한 뒤 흐름을 한 번\n돌린다. Administrator가 data asset과 delivery template을 준비하고, Data\nOwner가 data collection을 게시하고, Data User가 주문하고, Data Owner가\n승인한다. [Data Marketplace Introduction And Getting Started]</li>\n<li>Guide Me 패널과 My Data 페이지에서 주문 상태와 받은 데이터를\n확인한다. [Data Marketplace Introduction And Getting Started]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Introduction And Getting Started (Metadata Command Center)</td>\n<td>추출, 프로파일링, 분류, 관계 탐색, 커스텀 속성, 워크플로, 접근\n정책이 MCC의 기본 작업이다.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Introduction And Getting Started (Data Governance and Catalog)</td>\n<td>MCC가 추출한 메타데이터를 카탈로그로 보여 주고 검색·lineage·비즈니스\n맥락 연결을 제공한다.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Understanding Technical Assets</td>\n<td>기술 자산을 Data element / Technical data set / Data container로\n분류하고 소스별 추출 객체를 정리한다.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Understanding Business Assets</td>\n<td>AI Model부터 Regulation까지 비즈니스 자산 유형별 속성과 direct\nrelationship 유형을 다룬다.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Asset Discovery</td>\n<td>검색 쿼리 저장, 대시보드·위젯, Relationships(그리드/그래프), Data\nlineage, 감사 이력, Job Monitoring을 다룬다.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Data Access Management</td>\n<td>Data access control, Data filter, Data de-identification 정책과\nPrecedence tier, 8가지 de-identification 기법을 설명한다.</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Metadata Access Control Handbook</td>\n<td>Administrator의 사용자·그룹·역할에서 MCC의 access policy로 이어지는\n계층 구조와 PII 보호, 초안 자산 제한 예제를 담았다.</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Introduction And Getting Started (Data Marketplace)</td>\n<td>쇼핑카트 방식 셀프서비스. 게시, 검색, 주문, 승인, 전달의 7단계\n흐름과 역할별 권한을 설명한다.</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Enterprise Data Catalog User Guide</td>\n<td>On-Prem EDC. Discovery(검색, lineage와 impact, 데이터 미리보기)와\nAnalytics(대시보드, 리포트) 두 부분으로 구성된다.</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Data Governance User Guide (Axon)</td>\n<td>On-Prem Axon. 객체 인벤토리, Segmentation, 워크플로와 Change\nRequest, EDC 연동, DQ 규칙 자동화를 다룬다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>CDGC에서 보이는 기술 자산은 MCC의 catalog source 설정(추출 설정,\ncapability, 프로파일링 필터, 스케줄)에 달려 있다. 자산이 안 보이면 MCC\n설정부터 확인한다.</li>\n<li>검색 결과도 access policy로 걸러진다. 자산이 없는 것인지 권한이 없는\n것인지 먼저 구분한다.</li>\n<li>Metadata access control은 최소 권한 원칙을 따른다. 처음에는 access\npolicy를 몇 개만 만들어 디버깅을 쉽게 하라고 문서가 권한다.</li>\n<li>게시된 data access 자산을 수정하면 draft 사본이 생긴다. draft를\n게시할 때까지는 기존 게시본이 계속 적용된다. 검토가 필요하면 workflow를\n켠다.</li>\n<li>Tokenize 표현식은 anchor, backreference, capture group, 무한 반복,\n\\d·\\w 같은 축약 문자 클래스를 지원하지 않는다. 자산 감사 이력은 2년간\n보관된다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P10 M

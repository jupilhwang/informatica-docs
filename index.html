aster Data Management: 거버넌스로 정리한 데이터 위에 마스터\n데이터를 통합·정제한다.</li>\n</ul>\n"}, {"id": "P10", "title": "Master Data Management (MDM)", "level": "심화", "track": "Cloud + On-Prem", "goal": "MDM SaaS(Business 360)로 비즈니스 엔티티·매치/머지·360 앱을 구성한다. 온프렘 Multidomain MDM은 필요 시.", "steps": [{"d": "business-360-console", "f": "B360_.*_GettingStarted$", "why": "실습: Business 360 시작하기", "doc": 1680}, {"d": "multidomain-mdm-saas", "f": "Multidomain\\(MDM\\)SaaS$", "why": "Multidomain MDM SaaS", "doc": 1701}, {"d": "business-360-console", "f": "1785-informatica-mdm-saas-match-and-merge", "why": "매치/머지 베스트 프랙티스", "doc": 1691}, {"d": "customer-360-saas", "f": "Customer360SaaS$", "why": "Customer 360", "doc": 1698}, {"d": "business-360-console", "f": "1783-informatica-mdm---customer-360-saas-best", "why": "Customer 360 베스트 프랙티스", "doc": 1689}, {"d": "reference-360-saas", "f": "1267-Reference-360-Quickstart", "why": "실습: Reference 360 퀵스타트", "doc": 1711}, {"d": "reference-360-saas", "f": "Ref360_.*_Reference360$", "why": "Reference 360", "doc": 1707}, {"d": "product-360-saas", "f": "Product360SaaS$", "why": "Product 360", "doc": 1704}, {"d": "supplier-360-saas", "f": "Supplier360SaaS$", "why": "Supplier 360", "doc": 1713}, {"d": "master-data-management__multidomain-mdm", "f": "MDM_.*_ConfigurationGuide$", "why": "On-Prem MDM Hub 구성", "doc": 1772}, {"d": "master-data-management__multidomain-mdm", "f": "0782-mdm-hierarchy-configuration-tutorial", "why": "실습: 계층 구성 튜토리얼", "doc": 1790}, {"d": "master-data-management__multidomain-mdm", "f": "DataDirectorImplementationGuide", "why": "Data Director", "doc": 1774}], "summary": "<h1 id=\"p10-master-data-management-mdm\">P10. Master Data Management\n(MDM)</h1>\n<blockquote>\n<p>Business 360 Console에서 business application을 설정하고 Business\nEntity·Match and Merge·360 앱으로 마스터 레코드를 만든다. 온프렘\nMultidomain MDM은 필요할 때 따로 본다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>Business 360 Console에서 business application을 먼저 설정하고 데이터\n모델을 정의하는 순서</li>\n<li>Source record, trust score, survivorship으로 best version of the\ntruth를 만드는 원리</li>\n<li>Match and Merge 설정: candidate selection, key generation level,\ncandidate search level, ML 모델과 declarative rule</li>\n<li>Customer 360 / Product 360 / Supplier 360 / Multidomain MDM SaaS의\n공통 화면(레코드, 대시보드, 리포트, 계층, 태스크)</li>\n<li>Reference 360의 reference data set, code list, crosswalk 구조와\n온프렘 MDM Hub의 hierarchy 구성</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Business 360 Console</td>\n<td>MDM 프로젝트를 만드는 곳. 라이선스가 있는 business application을\n설정하면 predefined asset이 org에 로드된다.</td>\n</tr>\n<tr>\n<td>Business Entity</td>\n<td>마스터 데이터 모델 단위. Customer 360은 Person/Organization, Product\n360은 Item/Category, Supplier 360은 Supplier/Contact를 쓴다.</td>\n</tr>\n<tr>\n<td>Source record / Master record</td>\n<td>소스 시스템별 데이터는 source record로 저장되고, 가장 믿을 만한 값을\n모아 master record를 만든다.</td>\n</tr>\n<tr>\n<td>Trust score / Survivorship</td>\n<td>필드 값의 신뢰도와 관리자가 정한 생존 규칙. 둘을 합쳐 best version\nof the truth를 정하고 필요하면 수동 override한다.</td>\n</tr>\n<tr>\n<td>Match and Merge</td>\n<td>중복 레코드를 찾아 합치는 과정. ML model, declarative match rule,\n또는 둘 다 쓴다.</td>\n</tr>\n<tr>\n<td>Key generation level</td>\n<td>매치 키를 얼마나 촘촘히 만들지 정한다. Extended(소량·저품질),\nStandard(중간), Limited(대량·고품질) 중 고른다.</td>\n</tr>\n<tr>\n<td>Candidate search level</td>\n<td>매치 후보 검색 강도. Exhaustive, Extreme, Narrow, Typical 중 고른다.\n규칙은 전체가 아닌 후보에만 적용된다.</td>\n</tr>\n<tr>\n<td>Ingress / Egress job</td>\n<td>외부 소스에서 Business 360 data store로 적재하는 작업과 반대로\n내보내는 작업.</td>\n</tr>\n<tr>\n<td>Reference data set / Code list / Crosswalk</td>\n<td>참조 데이터 범주, 애플리케이션별 코드 값 묶음, 코드 리스트 간 단방향\nvalue mapping.</td>\n</tr>\n<tr>\n<td>Entity base object / Hierarchy profile</td>\n<td>온프렘 MDM Hub에서 계층을 구성하는 객체. entity type과 relationship\ntype을 hierarchy profile에 묶는다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>Business 360 Console에서 라이선스가 있는 business application을 먼저\n설정한다. predefined asset이 로드된 것을 확인한다. [Getting\nStarted]</li>\n<li>데이터 모델을 설계하기 전에 Limits and thresholds와 Identifiers 절을\n읽는다. 이어서 MDM SaaS 버전과 라이선스 만료 정보를 확인한다. [Getting\nStarted]</li>\n<li>Reference 360 준비: Administrator에서 SAML 설정 또는 사용자 생성,\nReference 360 역할 부여, 그룹 생성 후 사용자를 배정한다. REST API로\nmetadata picklist 값을 추가한다. [Reference 360 Quickstart]</li>\n<li>Country Codes reference data set을 만들고 그 안에 CRM Country\nCodes와 Marketing Country Codes code list를 만든다. [Reference 360\nQuickstart]</li>\n<li>각 code list에 code value를 만들거나 가져온다(예: \"United States of\nAmerica\"와 \"UNITED STATES OF AMERICA\"). [Reference 360 Quickstart]</li>\n<li>CRM에서 Marketing 방향으로 crosswalk를 만들고 두 값을 value\nmapping으로 연결한다. 이후 hierarchy를 만들고, 변경을 제안하고, draft\n승인 요청까지 이어 간다. [Reference 360 Quickstart]</li>\n<li>(온프렘 선택) Hub Console Hierarchies 도구로 Product hierarchy를\n구성한다. Product base object를 entity base object로 바꾸고, entity type\n2개와 relationship type 2개를 만든다. hierarchy profile, package\n생성·할당, Hierarchy Manager 표시 설정 순으로 진행한다. [Mdm hierarchy\nconfiguration tutorial]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Getting Started (Business 360 Console)</td>\n<td>asset을 만들기 전에 business application을 설정하고, 모델 설계 전에\nLimits and thresholds를 읽는다.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Multidomain MDM SaaS</td>\n<td>레코드·draft 관리, Match Analysis and Explainability 대시보드,\noverride survivorship과 unmerge, CLAIRE Copilot을 다룬다.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Informatica mdm saas match and merge best practices guide</td>\n<td>데이터 감사부터 candidate selection, key generation/search level,\nmerge threshold, ML 모델 학습까지 정리했다.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Customer 360 SaaS</td>\n<td>Person/Organization data dictionary와 CSV import 3방식(Import all,\nMatch and export, Match and import selected)을 다룬다.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Informatica mdm customer 360 saas best practices guide</td>\n<td>org 프로비저닝, 방화벽 IP 허용, 데이터 모델 설계, ingress/egress\n튜닝, 자산 마이그레이션 가이드를 담았다.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Reference 360 Quickstart</td>\n<td>reference data set, code list, code value, crosswalk, value mapping\n순서로 첫 참조 데이터를 만든다.</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Reference 360</td>\n<td>code list 이력과 시점 조회, multilingual(BCP 47), hierarchy, 승인\nworkflow, import/export job, REST API를 다룬다.</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Product 360 SaaS</td>\n<td>Item/Category business entity, 카테고리 hierarchy, rule association\n기반 속성 검증, 아이템 승인 workflow를 다룬다.</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Supplier 360 SaaS</td>\n<td>Supplier/Contact business entity, 주소·이메일·전화 검증, 공급업체\n승인 workflow를 다룬다.</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Configuration Guide (Multidomain MDM)</td>\n<td>온프렘 MDM Hub의 Hub Store, schema,\nLand/Stage/Load/Match/Consolidate/Publish 프로세스와 batch job을\n다룬다.</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Mdm hierarchy configuration tutorial</td>\n<td>Hierarchies 도구로 Product Group과 Product 계층을 9단계로\n구성한다.</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Data Director Implementation Guide</td>\n<td>subject area 기반 IDD 애플리케이션 구성(IDD Configuration Manager,\nIDDConfig.xml). 이 방식은 deprecated다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>매치 설정 전에 실제 운영 데이터 샘플로 완전성과 품질을 감사한다.\n문서 예시대로 postal code가 50% 레코드에만 있으면 exact match 필드로\n부적합하다.</li>\n<li>빈도가 높은 전화번호, 이메일, 단어는 동일 키를 대량으로 만든다. 후보\n목록이 커지므로 정제하거나 억제하고, 대용량이면 state/country code로\n후보를 필터링한다.</li>\n<li>ingress/egress job은 매시간 스케줄하지 않는다. 이전 작업이나 대용량\n데이터 때문에 실패한다. 병렬 실행과 성능을 위해 Business 360 connector\n대신 Business 360 FEP connector를 쓴다.</li>\n<li>predefined asset은 지우지 않는다. 커스텀 asset은 X_<asset name>으로\n이름을 붙이고, Business360·Customer360 같은 predefined project 대신 별도\nproject에 만든다.</li>\n<li>source primary key에 /, , ., %, ;, \"는 넣지 않는다. 255자를 넘으면\n잘린다. draft 기능과 task inbox는 preview라서 운영 환경에서는 지원되지\n않는다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>P11 AI &amp; CLAIRE: CLAIRE Copilot과 CLAIRE GPT로 자산 탐색과\n작업을 자연어로 처리한다.</li>\n</ul>\n"}, {"id": "P11", "title": "AI & CLAIRE", "level": "심화", "track": "Cloud", "goal": "CLAIRE GPT·Copilot·데이터 관리 에이전트로 생성형 AI 기반 데이터 관리를 활용한다.", "steps": [{"d": "claire-gpt", "f": "IntroductionAndGettingStartedWith", "why": "실습: CLAIRE GPT 시작하기", "doc": 978}, {"d": "claire-gpt", "f": "1838-start-your-generative-ai-journey", "why": "생성형 AI 여정", "doc": 984}, {"d": "claire-gpt", "f": "Using\\(CLAIRE-GPT\\)", "why": "CLAIRE GPT 사용", "doc": 979}, {"d": "claire-copilot", "f": "CopilotForDataIntegration", "why": "CDI Copilot", "doc": 972}, {"d": "claire-copilot", "f": "CopilotForApplicationIntegration", "why": "CAI Copilot", "doc": 971}, {"d": "data-management-agents", "f": "DataIntegrationAgent", "why": "DI 에이전트", "doc": 987}, {"d": "data-management-agents", "f": "DataQualityAgent", "why": "DQ 에이전트", "doc": 986}, {"d": "data-management-agents", "f": "DiscoveryAgent", "why": "Discovery 에이전트", "doc": 988}], "summary": "<h1 id=\"p11-ai--claire\">P11. AI &amp; CLAIRE</h1>\n<blockquote>\n<p>CLAIRE GPT, CLAIRE Copilot, 데이터 관리 에이전트를 써서 자산 탐색,\n품질 진단, ELT 파이프라인 생성을 자연어 프롬프트로 처리한다.</p>\n</blockquote>\n<h2 id=\"이-단계에서-배우는-것\">이 단계에서 배우는 것</h2>\n<ul>\n<li>CLAIRE GPT 대화 인터페이스 사용법: 샘플 프롬프트(#), 자산 참조(@),\n대화 메모리 초기화</li>\n<li>CLAIRE GPT를 제대로 쓰기 위한 최소 준비: catalog source, Data\nGateway Service, Data Integration 서비스</li>\n<li>CLAIRE Copilot으로 서비스 안에서 mapping, ingestion 작업, process를\n만들고 요약하는 방법</li>\n<li>Discovery, Data Quality, Data Integration 에이전트별 skill과\n제약</li>\n<li>여러 에이전트를 이어 써서 복합 목표(예: 환자 데이터 분석과 정정)를\n처리하는 흐름</li>\n</ul>\n<h2 id=\"핵심-개념\">핵심 개념</h2>\n<table>\n<thead>\n<tr>\n<th>개념</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CLAIRE</td>\n<td>Informatica의 AI·머신러닝 엔진. CLAIRE GPT와 Copilot이 이 엔진\n위에서 동작한다.</td>\n</tr>\n<tr>\n<td>CLAIRE GPT</td>\n<td>IDMC 전반의 데이터를 자연어로 찾고, 분석하고, 관리하는 agentic\n인터페이스. Data Governance, Data Quality, MDM 등 카테고리별 샘플\n프롬프트를 제공한다.</td>\n</tr>\n<tr>\n<td>CLAIRE Copilot</td>\n<td>개별 서비스 안에 붙은 대화형 UI. Data Integration, Application\nIntegration, Data Ingestion and Replication, 360 SaaS 앱에서 asset을\n만들고 요약한다.</td>\n</tr>\n<tr>\n<td>CLAIRE agents</td>\n<td>특정 skill을 가진 자율 에이전트. 추론·계획 모델로 수집, lineage\n추적, 품질 검증 같은 작업을 자동화한다.</td>\n</tr>\n<tr>\n<td>Discovery agent</td>\n<td>Data discovery, Metadata exploration, Data exploration을 맡는다.\n대상은 DGC, Data Integration, Data Marketplace, MDM SaaS다.</td>\n</tr>\n<tr>\n<td>Data quality agent</td>\n<td>assessment, diagnosis, rule recommendation, cleanse, rule\ngeneration을 맡는다. 모호한 경우에는 사람의 판단을 요청한다.</td>\n</tr>\n<tr>\n<td>Data integration agent</td>\n<td>프롬프트로 ELT pipeline을 만든다. 결과는 Data Integration의\nmapping으로 열어서 수정하고 실행한다.</td>\n</tr>\n<tr>\n<td>Clear conversation memory</td>\n<td>대화 맥락을 지우는 기능. 프롬프트로 요청하거나 아이콘을 눌러 새\n요청을 맥락 없이 시작한다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"실습-흐름-lab\">실습 흐름 (LAB)</h2>\n<ol type=\"1\">\n<li>사전 준비 사항(Before you begin)을 확인하고 CLAIRE GPT에 로그인한다.\nHome page의 샘플 프롬프트 카테고리를 살펴본다. [Introduction And Getting\nStarted With CLAIRE GPT]</li>\n<li>프롬프트 창에 직접 입력하거나 #으로 샘플 프롬프트를 불러와 수정한 뒤\nSubmit으로 대화를 시작한다. [Introduction And Getting Started With\nCLAIRE GPT]</li>\n<li>먼저 IDMC 사용법을 질문한다(예: \"How do I bulk import a glossary\ninto the catalog?\"). 답변은 How-To Library, Documentation portal,\nKnowledge Base를 종합해서 나온다. [Start your generative ai journey for\ndata management with c]</li>\n<li>Metadata Command Center에서 데이터 웨어하우스용 catalog source를\n만들고 메타데이터를 추출한다. 이후 \"Show data sets that have customer\ndata\"처럼 데이터 세트를 찾는다. [Start your generative ai journey for\ndata management with c]</li>\n<li>Secure Agent 하나 이상에서 IDMC Data Gateway Service가 돌고 있는지\n확인한다. 그다음 \"Show a preview of @SALESAMOUNT\"로 원천 데이터를 미리\n본다. [Start your generative ai journey for data management with c]</li>\n<li>런타임 환경에 Data Integration 서비스를 켠 뒤 \"Create a mapping to\nload all customer data added in the last 6 months\"로 ELT mapping을\n만든다. [Start your generative ai journey for data management with\nc]</li>\n<li>catalog source에서 Data Profiling과 Data Quality를 켜고 lineage용\nconnection을 지정한다. 이어서 \"Show the data quality score of\n@CUSTOMERID\", \"Show the lineage of @CUSTOMERID\"를 시도한다. 응답을\n평가하고, 끝나면 대화 메모리를 지운다. [Start your generative ai journey\nfor data management with c] [Introduction And Getting Started With\nCLAIRE GPT]</li>\n</ol>\n<h2 id=\"읽는-순서--문서별-포인트\">읽는 순서 &amp; 문서별 포인트</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>문서</th>\n<th>핵심 포인트</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Introduction And Getting Started With CLAIRE GPT</td>\n<td>대화 시작, 이름 변경·고정·검색, 응답 평가, Clear conversation\nmemory. 탐색 응답에는 항목별 설명이 붙는다.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Start your generative ai journey for data management with c</td>\n<td>카탈로그가 없어도 시작하는 7단계: IDMC 질문, 데이터 세트 탐색,\n데이터 탐색, ELT, 용어 기반 탐색, 프로파일링·lineage, DQ 점수.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Using CLAIRE GPT</td>\n<td>서비스별 시나리오(DGC 마케팅 캠페인, DQ 신용카드 정제, MDM\n캘리포니아 고객 리포트, 다중 에이전트 환자 데이터)와 Quick\nreference.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>CLAIRE Copilot For Data Integration</td>\n<td>mapping 생성, transformation 설정, Aggregator·Expression용\nexpression 생성, mapping 요약, ingestion and replication 작업 생성.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>CLAIRE Copilot For Application Integration</td>\n<td>사용 사례를 설명하면 필요한 객체와 connection을 갖춘 process를\n구성하고 XQuery expression을 생성한다.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Data Integration Agent</td>\n<td>단일 프롬프트나 탐색 후 변환 프롬프트로 ELT pipeline을 만들고 Open\nin Data Integration으로 연다.</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Data Quality Agent</td>\n<td>업로드 파일은 25MB까지 받고, 프로파일링은 10,000행·50열까지 한다.\n정제 계획을 승인하면 cleansed data와 mapplet을 만든다.</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Discovery Agent</td>\n<td>business user로 로그인하면 business asset이 technical asset보다 먼저\n나온다. 탐색 응답에서는 critical data element가 먼저 나온다.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"현업-팁--주의점\">현업 팁 · 주의점</h2>\n<ul>\n<li>CLAIRE GPT의 탐색 품질은 카탈로그 상태에 달려 있다. catalog source\n추출, glossary 연결, Data Classification·Profiling·Data Quality\ncapability를 먼저 켜 둔다.</li>\n<li>Data integration agent는 기존 데이터를 생성·이동·저장·삭제하지\n못하고 기존 mapping도 편집하지 못한다. 실행하려면 Designer 역할이 있어야\n한다.</li>\n<li>데이터 탐색 프롬프트가 복잡한 SQL을 쓰면 Data Integration이 그\n쿼리를 mapping으로 바꾸지 못할 수 있다.</li>\n<li>개인정보 보호 지침에 따라 샘플 데이터는 저장되지 않는다. 브라우저를\n새로고침하거나 로그아웃하면 사라지므로 필요하면 그 전에 CSV로 받아\n둔다.</li>\n<li>보안 관련 질문은 \"Is CLAIRE GPT secure?\" 프롬프트로 확인할 수 있다.\n이전 프롬프트는 위·아래 화살표 키로 다시 불러온다.</li>\n</ul>\n<h2 id=\"다음-단계\">다음 단계</h2>\n<ul>\n<li>마지막 단계: 전체 라이브러리에서 필요한 커넥터·제품 문서로\n확장한다.</li>\n</ul>\n"}], "tiers": {"1": "Integration", "2": "Data Quality · Governance · Catalog", "3": "MDM", "4": "기타"}};
const { products, docs, phases, tiers } = DATA;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const done = new Set(JSON.parse(localStorage.getItem("infa-done") || "[]"));
const save = () => localStorage.setItem("infa-done", JSON.stringify([...done]));
let current = null;

const kindBadge = k => `<span class="badge ${k === "Cloud" ? "cloud" : "onprem"}">${k === "Cloud" ? "Cloud" : "On-Prem"}</span>`;
const docLink = n => {
  const d = docs[n];
  return `<a class="doc" data-n="${n}">${esc(d.t)}</a>${d.l ? '<span class="badge lab">LAB</span>' : ""}${d.h ? '<span class="badge">H2L</span>' : ""}`;
};
const phaseProgress = ph => {
  const ns = ph.steps.filter(s => s.doc !== null);
  return [ns.filter(s => done.has(docs[s.doc].p)).length, ns.length];
};

function viewCurriculum(focus, scroll = true) {
  const all = phases.map(phaseProgress).reduce((a, [d, t]) => [a[0] + d, a[1] + t], [0, 0]);
  let h = `<h2>학습 로드맵 <span class="muted small">— 전체 ${all[0]}/${all[1]} 완료 · 단계별 순서대로 읽기 권장 · LAB = 실습형 문서</span></h2><div class="roadmap">`;
  for (const ph of phases) {
    const [d, t] = phaseProgress(ph);
    h += `<a href="#curriculum/${ph.id}"><b>${ph.id}</b> ${esc(ph.title)}<div class="small muted">${ph.level} · ${ph.track} · ${d}/${t}</div><div class="meter"><i style="width:${t ? 100 * d / t : 0}%"></i></div></a>`;
  }
  h += `</div>`;
  for (const ph of phases) {
    const [d, t] = phaseProgress(ph);
    h += `<details id="${ph.id}" ${focus === ph.id ? "open" : ""}><summary>${ph.id}. ${esc(ph.title)} <span class="badge">${ph.level}</span><span class="badge">${ph.track}</span> <span class="muted small">${d}/${t}</span></summary><div class="body"><div class="muted">🎯 ${esc(ph.goal)}</div>${ph.summary ? `<details class="sum" id="${ph.id}-sum"><summary>한 페이지 요약</summary><div class="md">${ph.summary}</div></details>` : ""}<ol class="steps">`;
    for (const s of ph.steps) {
      if (s.doc === null) continue;
      const p = docs[s.doc].p, pr = products[docs[s.doc].i];
      h += `<li class="${done.has(p) ? "done" : ""}"><input type="checkbox" data-p="${esc(p)}" ${done.has(p) ? "checked" : ""}> ${docLink(s.doc)} <span class="muted small">— ${esc(s.why)} · ${esc(pr.n)}</span></li>`;
    }
    h += `</ol></div></details>`;
  }
  $("#main").innerHTML = h;
  if (focus && scroll) document.getElementById(focus)?.scrollIntoView({ block: "start" });
}

function viewLabs() {
  let h = `<h2>랩 · 튜토리얼 · Getting Started · Quick Start <span class="muted small">(${docs.filter(d => d.l).length}건)</span></h2>`;
  for (const t of [1, 2, 3, 4]) {
    const ns = docs.map((d, n) => n).filter(n => docs[n].l && products[docs[n].i].t === t);
    if (!ns.length) continue;
    h += `<h3>Tier ${t} · ${tiers[t]}</h3><ul class="docs">` + ns.map(n => `<li>${docLink(n)} <span class="muted small">${esc(products[docs[n].i].n)}</span></li>`).join("") + `</ul>`;
  }
  $("#main").innerHTML = h;
}

function viewLibrary() {
  const byProduct = products.map(() => []);
  docs.forEach((d, n) => byProduct[d.i].push(n));
  let h = `<h2>전체 라이브러리 <span class="muted small">— ${products.length}개 제품 · ${docs.length}개 PDF · 중요도(Tier) 순</span></h2>`;
  for (const t of [1, 2, 3, 4]) {
    h += `<h3>Tier ${t} · ${tiers[t]}</h3>`;
    products.forEach((p, i) => {
      if (p.t !== t) return;
      const ns = byProduct[i], g = ns.filter(n => !docs[n].h), x = ns.filter(n => docs[n].h);
      const list = (arr, label) => arr.length ? `<h3>${label} (${arr.length})</h3><ul class="docs">${arr.map(n => `<li>${docLink(n)}</li>`).join("")}</ul>` : "";
      h += `<details><summary>${esc(p.n)} ${kindBadge(p.k)}<span class="badge">${esc(p.v)}</span> <span class="muted small">가이드 ${g.length} · H2L ${x.length}</span></summary><div class="body">`
        + (ns.length ? list(g, "가이드") + list(x, "How-To Library") : `<p class="muted">PDF 없음 — <a href="${p.web}" target="_blank">웹 문서 열기 ↗</a></p>`)
        + `</div></details>`;
    });
  }
  $("#main").innerHTML = h;
}

function viewSearch(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = docs.map((d, n) => n).filter(n => {
    const d = docs[n], hay = `${d.t} ${d.f} ${products[d.i].n}`.toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  $("#main").innerHTML = `<h2>“${esc(q)}” 검색 결과 <span class="muted small">${hits.length}건${hits.length > 500 ? " (상위 500건 표시)" : ""}</span></h2><ul class="docs">`
    + hits.slice(0, 500).map(n => `<li>${docLink(n)} <span class="muted small">${esc(products[docs[n].i].n)} ${products[docs[n].i].k === "Cloud" ? "" : "· On-Prem"}</span></li>`).join("") + `</ul>`;
}

function openDoc(n) {
  current = n;
  const d = docs[n], src = encodeURI(d.p);
  $("#vt").textContent = `${d.t} — ${products[d.i].n}`;
  $("#vf").src = src; $("#vnew").href = src;
  $("#vdone").textContent = done.has(d.p) ? "완료 취소" : "완료 표시";
  document.body.classList.add("viewing");
  document.querySelectorAll(".active-doc").forEach(e => e.classList.remove("active-doc"));
  document.querySelectorAll(`a.doc[data-n="${n}"]`).forEach(e => e.classList.add("active-doc"));
}

// Re-render in place after progress changes: keep open <details> and scroll position.
function rerender() {
  const open = [...document.querySelectorAll("details[open]")].map(d => d.id || d.querySelector("summary").textContent);
  const y = $("#main").scrollTop;
  route(false);
  document.querySelectorAll("details").forEach(d => { if (open.includes(d.id || d.querySelector("summary").textContent)) d.open = true; });
  $("#main").scrollTop = y;
  if (current !== null) $("#vdone").textContent = done.has(docs[current].p) ? "완료 취소" : "완료 표시";
}

function toggleDone(p) { done.has(p) ? done.delete(p) : done.add(p); save(); }

function route(scroll = true) {
  const [view, arg] = (location.hash.slice(1) || "curriculum").split("/");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + view));
  ({ curriculum: () => viewCurriculum(arg, scroll), labs: viewLabs, library: viewLibrary,
     search: () => viewSearch(decodeURIComponent(arg || "")) }[view] || viewCurriculum)();
  if (current !== null) document.querySelectorAll(`a.doc[data-n="${current}"]`).forEach(e => e.classList.add("active-doc"));
}

document.addEventListener("click", e => {
  const a = e.target.closest("a.doc");
  if (a) openDoc(+a.dataset.n);
});
document.addEventListener("change", e => {
  if (e.target.matches("input[type=checkbox][data-p]")) { toggleDone(e.target.dataset.p); rerender(); }
});
$("#vdone").onclick = () => { toggleDone(docs[current].p); openDoc(current); rerender(); };
$("#vclose").onclick = () => { document.body.classList.remove("viewing"); $("#vf").src = "about:blank"; current = null; };
let timer;
$("#q").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => { location.hash = e.target.value.trim() ? "search/" + encodeURIComponent(e.target.value.trim()) : "curriculum"; }, 200);
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
window.addEventListener("hashchange", () => route());
route();
</script>
</body>
</html>
